<script type="text/markdown" data-group="React" data-id="react-1" data-title="Fundamentals &amp; useState">
## Core Concepts
React components are just JavaScript functions that return **JSX**, syntax that compiles down to nested `React.createElement(type, props, children)` calls, meaning JSX is ultimately describing UI as plain data (a tree of objects), not directly manipulating the DOM. **Props** always flow one direction, downward, from parent to child, and are strictly read-only from the child's perspective, a component must never mutate its own `props`. **State** is data a component owns locally and can change over time via a setter function, changing state is what triggers a re-render.

Lists rendered with `.map()` require a stable, unique **`key`** prop on each item so React's reconciler can correctly match elements between renders, using the array index as a key is a common anti-pattern specifically when the list can reorder, insert, or delete items, because the index-to-item mapping shifts and React can misattribute state or DOM nodes to the wrong logical item. **Controlled components** keep an input's value fully driven by React state (`value={state}` + `onChange={e => setState(e.target.value)}`), making state the single source of truth. **Uncontrolled components** instead read the current DOM value directly via a `ref` when needed, React idiom strongly favors controlled components as the default, reaching for uncontrolled only in specific cases (file inputs, which literally cannot be controlled by React for security reasons, or performance-sensitive inputs where re-rendering on every keystroke is genuinely too costly).

`useState(initialValue)` returns a `[value, setter]` pair. Calling the setter **schedules** a re-render, it does not synchronously update the variable in your current function's closure, this is what people mean by state updates being "asynchronous." Within a single event handler, React **batches** multiple setter calls together into one single re-render rather than one render per call, a real performance optimization, but it means you can never read a just-set new value later in that same handler by reading the original state variable, it will still show the old value until the next render actually happens. Whenever a new state value depends on the *previous* state value, always use the **functional updater** form, `setCount(prev => prev + 1)`, rather than `setCount(count + 1)`, because the functional form is guaranteed to receive the truly latest state at the moment React actually applies it, while `count` in your closure might be stale, especially if multiple updates are queued in the same batch.

```js
// Bug: both calls close over the exact same stale `count` value from this render
setCount(count + 1);
setCount(count + 1); // count only ends up going up by 1, not 2, as you'd naively expect

// Fix: functional updates always operate on the truly latest queued value
setCount(prev => prev + 1);
setCount(prev => prev + 1); // correctly goes up by 2
```

React batches updates inside React event handlers by default, and since **React 18**, this automatic batching was extended to cover promises, `setTimeout` callbacks, and native browser event handlers too, previously (React 17 and earlier) only updates inside actual React-managed event handlers were batched automatically, updates inside a raw `setTimeout` or a promise `.then()` each triggered their own separate render.

`useState`'s initial value argument is only ever actually used on the component's very first render, it's simply discarded on every subsequent render. This means passing a literal expensive computation directly, `useState(expensiveComputation())`, wastefully re-runs that computation on every single render even though the result is thrown away, the fix is passing a **function** instead, `useState(() => expensiveComputation())`, so React only invokes it once, on mount.

```js
// Runs expensiveInit() on every single render, wasteful — the result is discarded after mount anyway
const [state, setState] = useState(expensiveInit());

// Runs it only once, on mount, via React's lazy initializer form
const [state, setState] = useState(() => expensiveInit());
```

## Common Mistakes
- Mutating state directly (`state.items.push(x)` then calling `setState(state)`) instead of creating a genuinely new array/object, React's change-detection compares by reference, a mutated-in-place object still looks identical by reference, so React may not even re-render.
- Deriving a piece of state from `props` with `useState` and never keeping it in sync afterward, when the prop later changes, the component's local copy silently goes stale, showing outdated data.
- Passing a directly-invoked expensive computation as `useState`'s initial value instead of wrapping it in a lazy initializer function, wasting that computation on every re-render.
- Using the array index as a `key` for a list that can reorder or have items removed from the middle, causing subtle state/DOM mismatches as items shift position.
- Reading a state variable immediately after calling its setter within the same function body and expecting to see the updated value, the update hasn't rendered yet at that point.
- Treating an uncontrolled input as the default choice out of unfamiliarity with controlled forms, missing out on React's single-source-of-truth benefits (easy validation, easy programmatic resets, consistent behavior) for no real reason.

## Interview Questions
1. *Why is array index as key discouraged specifically, not always?* It's fine for a genuinely static list that never reorders, is never filtered, and never has items inserted/removed from anywhere but the end. The moment any of those things can happen, the index-to-item mapping shifts between renders, and React can incorrectly reuse DOM nodes and internal component state for what's now logically a different item.
2. *Why is `setState` described as "asynchronous" when it isn't truly async in the Promise sense?* Because calling the setter doesn't immediately update the variable available in your current render's closure, the update is scheduled and applied on a subsequent render pass. It's synchronous scheduling with deferred application, not asynchronous in the technical `await`-able sense, but functionally you must treat "the new value" as unavailable until the next render.
3. *Controlled vs. uncontrolled, when would you genuinely choose uncontrolled?* File inputs, which browsers deliberately never let JavaScript fully control for security reasons, or extremely performance-sensitive text inputs (like a live code editor with thousands of characters) where re-rendering the whole component tree on every keystroke measurably hurts responsiveness.
4. *What does JSX actually compile to, and why does that matter?* Nested `React.createElement(type, props, children)` calls, producing plain JavaScript objects describing the desired UI tree. This matters because it demystifies JSX entirely, it's not magic, it's just a nicer syntax for building the same object tree you could write by hand.
5. *Walk through the stale-closure bug and its fix in detail.* Each render of a function component captures a fresh snapshot of `count` at that render's value inside its own function-scope closure. If you call `setCount(count + 1)` twice in the same handler, both calls reference the *same* captured `count`, so the second call overwrites rather than compounds the first. The functional updater form `setCount(prev => prev + 1)` sidesteps this entirely because React passes in whatever the truly latest pending value is at the moment it processes that specific update, not whatever was captured in the render's closure.
6. *What is automatic batching, and precisely what changed about it in React 18?* Automatic batching means multiple `setState` calls that happen within the same synchronous block of code are merged into a single re-render rather than triggering one render per call. Prior to React 18, this batching only happened inside handlers React itself was managing (like `onClick`). React 18 extended it to also cover updates inside promises, `setTimeout`/`setInterval` callbacks, and native (non-React) event listeners, contexts where updates previously triggered separate, unbatched renders each.
7. *Why pass a function to `useState` instead of a direct expensive value?* A directly-passed value is evaluated fresh on literally every render of the component, even though React only ever actually uses that value on the very first render and silently discards it every render after. Passing a function defers that computation, and React guarantees it only calls that function once, on mount.
8. *Why can mutating state directly appear to "work" in a quick test but cause real bugs later?* Because the DOM might happen to still visually reflect the mutation if you're inspecting it directly, but React's internal change-detection (used for deciding whether to re-render, and for things like `React.memo`) relies on reference equality. A mutated-in-place object has the same reference as before, so React can conclude "nothing changed" and skip work that should have happened, leading to stale UI that only manifests under specific conditions.
9. *Derived state vs. duplicated state, what's the actual distinction?* Derived state is computed fresh, directly from `props` (or other state) during every render, with no separate `useState` call at all, it's automatically always in sync because it's recalculated every time. Duplicated state copies a prop's value into a component's own `useState` at some point (often on mount), creating a second, independent source of truth that can silently drift out of sync if the original prop changes afterward.
10. *Why does a list item's key matter for more than just React's internal bookkeeping?* A stable key is also what determines whether that specific item's own local state (its own `useState` calls, its own uncommitted form input, etc.) is preserved across a re-render, or thrown away and reset because React concluded it's now looking at a logically different element occupying that slot.
11. *What's the actual runtime return type of a function component, before JSX compilation is considered?* A plain JavaScript object (or array of objects, or `null`), describing an element tree, it is emphatically not a DOM node, a string of HTML, or anything the browser understands directly, React itself is responsible for translating that object tree into real DOM operations.
12. *Give a concrete scenario where automatic batching in React 18 changes observable behavior compared to React 17.* Two `setState` calls inside a `setTimeout` callback: in React 17, this would trigger two separate re-renders (as the callback isn't a React-managed event handler); in React 18, both calls are automatically batched into a single re-render, potentially changing how many times a component's body (and any logging inside it) actually executes.
13. *Why is `useState`'s setter guaranteed to trigger a re-render even if you technically pass in the "same" primitive value?* In modern React, setting state to a value that is `Object.is`-equal to the current value actually bails out of re-rendering as an optimization (for primitives specifically), so passing the literal same primitive value does NOT trigger a re-render, a nuance worth knowing precisely rather than assuming every setter call always re-renders unconditionally.
14. *How would you correctly reset a controlled form's fields on submit?* Update the state that drives each controlled input back to its initial values inside the submit handler (e.g., `setFormData(initialFormData)`), since the inputs are entirely driven by state, resetting the state resets what's displayed automatically, no direct DOM manipulation needed.
15. *Why might reaching for an uncontrolled `ref`-based input "just to avoid re-renders" often be the wrong optimization?* Modern React re-renders are typically very cheap, and premature uncontrolled-input optimization sacrifices React's single-source-of-truth model (making validation, conditional disabling, and programmatic value changes all more awkward) for a performance gain that's usually not measurable in practice, it should be reached for only after profiling shows a genuine problem.

## Quick Test
- What does `useState`'s setter return, and can you use the new value before the next render?
- Rewrite `setCount(count+1)` twice using the functional form.
- Why is a random key also a bad key choice?
- What determines whether a component re-renders when its parent re-renders?
- What's the actual return type of a component function?
- What's the difference between passing `expensiveInit()` and `() => expensiveInit()` to `useState`?
- Why does mutating an array in state sometimes fail to trigger a re-render?
- Name one thing React 18's automatic batching added over previous versions.
- What's derived state, and why avoid duplicating a prop into local state unnecessarily?
- What happens to a list item's local state if its key changes between renders?
- Does setting state to the exact same primitive value always trigger a re-render?
- How would you reset every field of a controlled form on submit?
- Give one legitimate reason to use an uncontrolled input instead of a controlled one.
- Give a concrete example where React 18's batching changes observable render count vs React 17.
- Why is JSX described as "just data," and why does that framing matter?
</script>

<script type="text/markdown" data-group="React" data-id="react-2" data-title="useEffect &amp; Hooks Deep Dive">
## Core Concepts
`useEffect(fn, deps)` runs `fn` **after** React has committed changes to the DOM and the browser has painted, making it the correct place for anything that needs to interact with the outside world after a render is visible: subscriptions, manual DOM measurements, logging, data fetching. The dependency array precisely controls when the effect re-runs: **omitted entirely** means it runs after every single render (rarely what you want); an **empty array `[]`** means it runs exactly once, after the initial mount; **`[a, b]`** means it re-runs whenever `a` or `b` changes, compared by `Object.is` (which means a freshly-created object or array literal in the dependency array is a "different" value on every render, always triggering a re-run).

The function passed to `useEffect` can optionally **return a cleanup function**. React calls that cleanup right before running the effect again (if dependencies changed) and also on the component's unmount. This cleanup is essential for canceling subscriptions, clearing timers, removing event listeners, or aborting in-flight network requests to prevent a **race condition**, a slower, earlier-started request resolving *after* a newer one and overwriting fresher state with stale data.

A very common and subtle trap is a **stale closure**: if an effect's function body reads a variable that isn't listed in the dependency array, that effect keeps referencing the value that variable had at the time the effect was originally created, not any later value, even if the component has since re-rendered with a new value for that variable. This is exactly why the ESLint `react-hooks/exhaustive-deps` rule exists, to catch dependencies you've silently forgotten to list.

React 18's Strict Mode deliberately double-invokes effects in development (mount → cleanup → mount) specifically to surface effects with missing or broken cleanup logic early, before they cause real bugs in production, it is intentional, defensive tooling behavior, not a framework bug.

```js
useEffect(() => {
  let cancelled = false;
  fetch(`/api/user/${id}`).then(res => res.json()).then(data => {
    if (!cancelled) setUser(data); // guard against a stale, out-of-order response
  });
  return () => { cancelled = true; }; // cleanup: mark this specific effect run as stale
}, [id]);
```

**Hooks deep dive**: `useRef(initialValue)` returns a mutable `{current: value}` object that persists across renders without ever triggering a re-render when mutated, making it the right tool for holding DOM node references, or for any "instance variable" a class component would have held on `this`, that a component needs to remember but doesn't need to be reactive to. `useMemo(fn, deps)` memoizes the **computed result** of `fn`, only recalculating it when a dependency actually changes, useful for genuinely expensive calculations. `useCallback(fn, deps)` memoizes the **function reference itself**, functionally equivalent to `useMemo(() => fn, deps)`, its real purpose is preserving referential equality so a `React.memo`-wrapped child, or another hook's dependency array, doesn't see "a new function" on every render. `useContext(SomeContext)` reads the nearest matching `Provider`'s value without threading it down manually through every intermediate component (prop drilling). **Custom hooks** are simply ordinary functions, conventionally named starting with `use`, that internally call other hooks to share stateful logic across components, React itself attaches no special meaning to the name, it's the linter that enforces the naming-based rules. **The rules of hooks** (only call hooks at the top level of a component or another hook, never inside conditions, loops, or nested functions; only call hooks from React function components or custom hooks) exist because React identifies each hook call by its **call order** across renders, not by name, a hook skipped by a condition on one render but not another shifts every subsequent hook's internal slot, silently corrupting state.

```js
function useInterval(callback, delay) {
  const savedCallback = useRef(callback);
  useEffect(() => { savedCallback.current = callback; }); // always the latest callback, no need to re-subscribe
  useEffect(() => {
    if (delay === null) return;
    const id = setInterval(() => savedCallback.current(), delay);
    return () => clearInterval(id);
  }, [delay]); // only re-subscribes if the delay itself actually changes
}
```

## Common Mistakes
- Putting a function that's freshly created on every render directly into a dependency array without wrapping it in `useCallback`, causing that effect to re-run on literally every render, since a new function reference always fails the `Object.is` dependency comparison.
- Calling a custom hook conditionally (inside an `if` block or after an early `return`), breaking the exact same top-level-only rule that applies to every built-in hook.
- Assuming two components that both use the same custom hook somehow share that hook's internal state, they absolutely do not, each call site gets its own completely independent instance of every `useState`/`useRef` inside that hook.
- Fetching data inside `useEffect` without any cleanup or cancellation logic, leaving the component vulnerable to race conditions where an older, slower response overwrites newer state.
- Reaching for `useEffect` to compute a value that's actually derivable directly during render from existing props/state, unnecessarily adding an extra render cycle and complexity where a simple calculation during render would do.
- Forgetting that an object or array literal in a dependency array (`[{...}]` or `[[1,2]]`) is a brand-new reference on every single render, defeating the entire purpose of listing it as a dependency in the first place.

## Interview Questions
1. *Why can `useEffect` run twice in development under React 18?* React 18's Strict Mode deliberately performs a mount → cleanup → mount sequence in development specifically to help developers catch effects whose cleanup logic is missing or incorrect, exposing bugs proactively before they reach production, where effects genuinely only mount once.
2. *`useMemo` vs. `useCallback`, precisely?* `useMemo` caches and returns the *result* of calling a function; `useCallback` caches and returns the *function itself*, unexecuted, both exist to avoid unnecessary recomputation or, more commonly, to preserve referential equality for dependency arrays and `React.memo` comparisons.
3. *Why must hooks be called unconditionally, at the top level, every single render?* Because React associates each hook call with its internal state purely by the *order* in which hooks are called during a render, not by any name or identifier. If a hook call is conditionally skipped on some renders but not others, every hook called after it shifts into the wrong internal slot, silently corrupting component state in hard-to-debug ways.
4. *How do you avoid a race condition in a data-fetching effect?* Track a boolean "cancelled" flag (or better, an `AbortController`) inside the effect's cleanup function, and check that flag before applying the fetched result to state, ensuring a response from a superseded, earlier request is never allowed to overwrite state set by a newer one.
5. *When would you reach for `useRef` instead of `useState`?* Whenever a value needs to persist across renders but changing it should never itself trigger a re-render, holding a reference to a DOM node, tracking a previous value for comparison, or storing a mutable "instance variable" like a timer ID.
6. *Do two components using the same custom hook share state through it?* No, categorically not, unless the hook itself explicitly reads from something external and shared, like a Context value or a module-level variable outside any hook call. Each call site of a custom hook gets its own fully independent copy of every internal `useState`/`useRef`/etc. it uses.
7. *What actually enforces the rules of hooks, React itself at runtime, or something else?* Mostly the separate `eslint-plugin-react-hooks` ESLint plugin, which statically analyzes your code for violations. React itself does almost no runtime verification of call order, violating the rules typically manifests as subtly wrong behavior (state appearing to belong to the wrong variable) rather than a helpful thrown error.
8. *Why store a callback inside a `ref` within a custom `useInterval` hook, rather than just listing the callback in the effect's dependency array?* If the callback were a dependency, the interval would need to be torn down and recreated every single time a new (often inline, freshly-created) callback function was passed in, causing unwanted resets. Storing the latest callback in a ref lets the interval keep running uninterrupted while always calling the most recent version of the callback.
9. *What's the concrete effect of forgetting to wrap a dependency function in `useCallback`?* The effect (or memoized child component) that depends on that function reference re-runs (or re-renders) on literally every parent render, since a plain inline function is a brand-new reference every time, defeating whatever memoization or effect-scoping was intended.
10. *When is `useContext` alone genuinely not enough, favoring something like Redux or Zustand instead?* When the shared state is large, updated frequently, and consumed widely across the tree, since every single consumer of a Context re-renders on any change to that Context's value, regardless of which specific slice of it they actually use, this becomes a real performance problem at scale that dedicated state libraries are built to address with more granular subscriptions.
11. *Walk through exactly why an object literal dependency causes infinite-loop-like re-running.* `useEffect(fn, [{a: 1}])`, on every render, a brand-new object literal `{a:1}` is created and passed as the dependency array's element. `Object.is` compares by reference, not deep equality, so this "new" object is always considered different from the previous render's object, causing the effect to re-run every single render, potentially triggering a state update inside it that causes yet another render, and so on.
12. *What's a legitimate use case for `useLayoutEffect` instead of `useEffect`?* When you need to measure the DOM (like an element's actual rendered size) and synchronously make a state update *before* the browser paints, to avoid a visible flicker, `useLayoutEffect` runs synchronously right after DOM mutations but before the browser paints, whereas `useEffect` runs after paint, which could show a brief incorrect frame first.
13. *Why is deriving a value directly during render usually better than computing it inside a `useEffect` plus a second `useState`?* Computing during render is simpler, always in sync, and avoids the extra render cycle that a "compute in an effect, then `setState`" approach introduces, that pattern should be reserved for cases where the computation genuinely can't happen synchronously during render, like something depending on the actual committed DOM.
14. *How would you implement a custom `usePrevious(value)` hook?* Using a `useRef` combined with a `useEffect`: the ref holds the previous value, and an effect (running after render) updates the ref to the current value, `function usePrevious(value) { const ref = useRef(); useEffect(() => { ref.current = value; }); return ref.current; }`, the ref still holds the *previous* render's value at the time the hook body itself runs, because the effect updating it hasn't fired yet.
15. *Why does calling `setState` inside a `useEffect` with no dependency array at all risk an infinite render loop?* An effect with no dependency array runs after every single render. If that effect calls a state setter (even conditionally in a way that always ends up triggering), it causes a re-render, which runs the effect again, which sets state again, an unbroken cycle unless the update is somehow made conditional on state that eventually stops changing.

## Quick Test
- What three timing options does the dependency array give you?
- Why does an object literal in the dependency array almost always cause the effect to re-run every render?
- What does an effect's cleanup function guard against, name two situations.
- What happens internally if you call `useState` inside an `if` block?
- Difference in what's returned by `useMemo` vs `useCallback` for the same arrow function.
- Do two components using the same custom hook share its internal state?
- What actually catches a hooks-rule violation, React itself or a lint rule?
- Why store a callback in a ref inside a custom interval hook?
- What happens if you forget to wrap a dependency function in `useCallback`?
- When would Context alone not be enough, favoring something like Redux?
- When would you reach for `useLayoutEffect` instead of `useEffect`?
- Implement a `usePrevious(value)` custom hook.
- Why can an effect with no dependency array that calls a setter cause an infinite loop?
- Why is deriving a value during render usually better than computing it in an effect?
- What's the real mechanism behind React associating hook calls with the correct state, given hooks have no explicit id?
</script>

<script type="text/markdown" data-group="React" data-id="react-3" data-title="Rendering Internals">
## Core Concepts
A state update kicks off React's **render phase**: React calls your component function again from scratch, producing a brand-new tree of React elements (the "virtual DOM," really just plain JS objects). React then **diffs** ("reconciles") this new tree against the previous one to compute the minimal set of actual DOM operations needed. Only after the *entire* tree has been diffed does React enter the **commit phase**, applying every computed DOM change in one batch, and only then running any effects scheduled for that render. This two-phase split matters practically: the render phase must be free of side effects (it can even be paused, thrown away, or re-run by React under concurrent features), while the commit phase is where it's actually safe to read or measure the real DOM, since it's guaranteed to reflect the latest render's output at that point.

**Fiber** is the name of React's internal reconciliation engine and data structure, a linked-list-like structure of "fiber nodes," one per component instance, that lets React break rendering work into small interruptible units. This unlocked React's concurrent features entirely, a big re-render can now be **paused partway through** to let a more urgent update (like responding to a keystroke) jump the queue and render first, something the older, purely recursive "stack reconciler" architecture could never do, once it started rendering a subtree, it had to finish before yielding control back to the browser.

**Keys** are the mechanism React's diffing algorithm uses to match elements between the old and new tree at the same position in a list. The same key at the same tree position tells React "this is logically the same element," so it reuses the existing DOM node and preserves that component's internal state, only updating whatever props actually changed. A different key at that position tells React "this is now a logically different element," so it fully unmounts the old instance (discarding its state and DOM node) and mounts a completely fresh one, even if the new element looks visually identical to what was there before.

Walking through exactly what happens on `setState()`: React schedules an update on the corresponding fiber → re-renders that component (calling its function body again) and, by default, its entire subtree of children too (unless intercepted by `React.memo` with unchanged props) → diffs the resulting new tree against the previous committed tree → commits only the actual computed DOM deltas in one pass → runs any effects (`useEffect`/`useLayoutEffect`) scheduled as part of that render. Critically, a parent component re-rendering does **not** automatically mean the child's real DOM changes, the child's function still runs again (unless memoized), but if the resulting output tree is identical to before, React's diffing finds nothing new to actually write to the DOM.

```js
function handleClick() {
  setCount(count + 1);
  console.log(count); // still the OLD value here — the render triggered by setCount hasn't happened yet
}
```

React's diffing algorithm makes a deliberate performance tradeoff over a theoretically "perfect" minimal diff: it assumes that elements of the **same type** at the **same tree position** are related and worth comparing property-by-property, but if the type changes at that position (a `<div>` replaced by a `<span>`, or one component type replaced by another), React doesn't even attempt to patch the difference, it tears down the entire old subtree and builds a completely new one from scratch. This is O(n) instead of the O(n³) a truly optimal tree-diff algorithm would require, a conscious engineering tradeoff, not an oversight.

## Common Mistakes
- Reading a state variable immediately after calling its own setter within the same function and expecting to see the freshly-set value, the actual re-render (and therefore the updated closure value) hasn't happened yet at that point in the code.
- Assuming changing an element's type at a given tree position just updates its existing props in place, React actually discards and fully remounts that entire subtree from scratch, losing any local component state that lived there.
- Believing every single `setState()` call necessarily causes its own separate, immediate render, in nearly all common contexts (especially React 18+), multiple calls within the same synchronous block are batched into just one render pass.
- Assuming a parent's re-render always implies visible DOM changes for its children, the child function does re-run, but if its computed output is identical to before, nothing new is actually written to the real DOM.
- Forgetting that fibers, not real DOM nodes, are the actual unit React's reconciler operates on, useful to know precisely when debugging why a certain optimization technique does or doesn't help.
- Expecting React's diffing to find and preserve state across a type change at the same position (e.g., swapping between two different component types conditionally rendered at the same spot), a full remount happens instead, unless you explicitly give both branches the same stable key structure that survives the swap.

## Interview Questions
1. *Walk through, in complete detail, what happens when I call `setState()`.* React schedules an update on the fiber corresponding to that component → the render phase re-invokes the component function (and, absent memoization, its children too) producing a new element tree → React diffs that new tree against the previously committed one, computing the minimal set of real DOM operations needed → the commit phase applies exactly those DOM changes in one pass → any effects scheduled for that render run afterward.
2. *Does a parent re-rendering always mean the child's actual DOM changes?* No. The child component function does get called again (unless it's wrapped in `React.memo` and its props are unchanged), but if the resulting output tree for that child is identical to the previous render's output, React's diffing algorithm finds no actual differences and writes nothing new to the real DOM for it.
3. *Why can changing a list item's key attribute unintentionally reset that component's internal state?* A different key at the same tree position signals to React that this is now a logically distinct element, not an update to the existing one. React responds by fully unmounting the previous instance (and discarding all of its internal `useState`/`useRef` values) and mounting a brand-new instance from scratch, even if the visible rendered output looks unchanged to a human eye.
4. *What specific problem does the Fiber architecture solve that the old "stack reconciler" fundamentally couldn't?* Interruptibility. The old recursive stack-based reconciler had to fully complete rendering a subtree once it started, with no way to pause partway through. Fiber's linked-list-based unit-of-work model lets React pause a long, low-priority render to let a more urgent update (a keystroke, a click) render and commit first, keeping the UI responsive, this is the literal foundation concurrent features like `useTransition` are built on.
5. *Render phase vs. commit phase, which is genuinely safe to read the real DOM in, and precisely why?* The commit phase. During the render phase, React is only computing a description of the intended UI, the actual DOM hasn't been touched yet for this render, so reading it there can return stale information from the previous commit, or in concurrent rendering, could even be reading state mid-way through an interrupted, never-committed render pass.
6. *Why does logging state immediately after calling its own setter still show the old value?* Because calling the setter only *schedules* a re-render, it does not synchronously mutate the variable available in the current closure. The updated value only becomes visible the next time the component function actually runs again, producing a fresh closure with the new value baked in.
7. *What precisely happens when an element's type changes at a given tree position during reconciliation?* React doesn't attempt to reconcile props or preserve state across a type change at all, it treats it as "this entire subtree is gone, and a completely new one has appeared here," tearing down the old DOM nodes and any component state that lived in them, and mounting a fresh subtree from nothing.
8. *Are all `setState` calls automatically batched, in every context, as of React 18?* In React 18+, yes, essentially in all common execution contexts, React event handlers, promises, `setTimeout` callbacks, and native browser event listeners. In React 17 and earlier, only updates inside React's own managed event handlers were automatically batched, updates elsewhere (raw timeouts, promises) each triggered their own separate render.
9. *What is the actual unit React's reconciler operates on internally, a real DOM node, or something else?* A **fiber**, an internal JavaScript object describing one component instance's work, its type, its pending props, its relationship to sibling/parent/child fibers, and its current state, a fiber may or may not correspond one-to-one with an actual DOM node (a component that returns `null`, or a Fragment, has a fiber but no direct DOM node).
10. *Why is understanding the render/commit split genuinely useful for debugging a "flash of stale content" style bug?* It tells you precisely which category the bug falls into: if the wrong content is being *computed* at all, the bug lives in your render-phase logic (what the component function returns given its current props/state). If the correct content is computed but something visually flickers or appears momentarily wrong, the bug more likely lives in effect timing relative to the commit (something running in `useEffect` after paint that a `useLayoutEffect` running before paint would have prevented).
11. *Why can't React simply preserve a component's local state across a type change at the same tree position, even if you wanted it to?* Because different component types can have entirely incompatible internal state shapes and lifecycle expectations, there's no generally safe way to "translate" one component's `useState`/`useRef` values into a different, unrelated component type's expectations, so React deliberately doesn't attempt it, a full remount is the only sound option.
12. *What's a practical technique to force React to remount a component intentionally, on purpose?* Change its `key` prop, since React treats a changed key as "a logically different element," even with everything else identical, this is a common idiom for resetting a component's entire internal state cleanly (for example, remounting a form component when switching between different records to edit, to clear all field state).
13. *Why is React's diffing algorithm described as O(n) rather than the theoretically optimal O(n³) a general tree-diff would require?* Because React makes simplifying assumptions rather than solving the fully general "minimum edit distance between two arbitrary trees" problem, specifically, that elements of different types at the same position are never worth deeply comparing (just replace), and that keys reliably identify list items across renders, these heuristics trade a small amount of theoretical optimality for a massive, practically necessary performance win.
14. *Does React guarantee the order in which sibling components' effects run relative to each other?* Yes, effects run in the order the components appear in the tree (depth-first, children generally before their own effects fire relative to how the commit walks the tree), a detail that occasionally matters when effects in sibling or parent/child components have an implicit ordering dependency, though relying on that ordering explicitly is generally considered fragile design.
15. *Why might two visually identical re-renders still have very different actual costs?* Because "visually identical output" only tells you the *commit phase* did little to no DOM work, it says nothing about how expensive the *render phase* itself was, if the component (or its non-memoized children) perform heavy computation during render even when the final output doesn't change, that cost is paid on every re-render regardless of what gets written to the DOM.

## Quick Test

- Does changing a child's key ever reset its internal state? Why?
- What's the difference between a fiber and a real DOM node?
- Why does state read right after its own setter call still show the old value?
- What's the practical benefit of Fiber being interruptible?
- Give one reason a parent's re-render doesn't always change the child's actual DOM.
- What causes React to fully unmount and remount a subtree instead of patching it?
- Which phase, render or commit, is unsafe to read the DOM in, and why?
- Are all `setState` calls automatically batched in React 18?
- Name one debugging benefit of understanding the render vs commit split.
- How would you intentionally force a component to remount using its key?
- Why is React's diffing described as O(n) instead of the theoretically optimal O(n³)?
- Does React guarantee effect ordering across sibling components?
- Why can two visually identical re-renders still have very different real costs?
- Why can't React preserve state across a component type change at the same position?

<script type="text/markdown" data-group="React" data-id="react-4" data-title="Forms, Context &amp; Redux Toolkit">
## Core Concepts
Controlled forms tie every input's displayed `value` directly to React state, with an `onChange` handler updating that state on every keystroke, making state the single, authoritative source of truth for what's on screen. For forms with many fields, the idiomatic pattern is a single state object plus one generic `handleChange` keyed off each input's `name` attribute (`setFormData(prev => ({...prev, [e.target.name]: e.target.value}))`), rather than a separate `useState` per field. Validation typically runs either on submit (checking everything at once) or on blur (checking a field the moment the user leaves it), with error messages themselves also usually kept in state so they can be displayed and cleared reactively. Dynamic, add/remove-able fields and file uploads need special handling, files specifically can never be set programmatically via a controlled `value` for security reasons, they're read through a `ref` and the `FileReader`/`FormData` APIs instead.

**Context API** exists specifically to solve **prop drilling**, passing a prop down through several layers of components that don't themselves use it, purely so a much deeper descendant can access it. The pattern is `createContext(defaultValue)`, wrapping part of the tree in a `<Context.Provider value={...}>`, and calling `useContext(Context)` in any descendant that needs the value, no matter how deeply nested. Context's real limitation, and the thing that most distinguishes it from a dedicated state-management library, is that **every single consumer of a Context re-renders whenever that Context's value changes**, regardless of which specific slice of a larger value object that particular consumer actually reads, this is fine for infrequently-changing, narrowly-scoped values (theme, authenticated user), and a real performance liability for large, frequently-updated, widely-consumed state.

**Redux** centralizes all application state in a single store. Components **dispatch actions** (plain, serializable objects describing "what happened," conventionally `{type: 'counter/incremented', payload: ...}`), a **reducer** (a pure function taking the current state and an action, returning the new state, never mutating the old one) computes the next state, and **selectors** are simple functions that read a specific slice back out of the store for a component to use. **Redux Toolkit (RTK)** is the now-standard, officially-recommended way to write Redux, eliminating most of classic Redux's notorious boilerplate. `createSlice({name, initialState, reducers})` auto-generates both the action creators and the reducer function for you from a single, colocated definition. Internally, RTK uses **Immer**, a library that lets you write reducer logic that *looks* like direct mutation (`state.value += 1`) while Immer actually intercepts those operations via a JavaScript Proxy and produces a properly new, immutable state object behind the scenes, giving you Redux's required purity guarantees with none of the tedious manual spreading. **RTK Query**, RTK's built-in data-fetching and caching layer, replaces a large amount of hand-rolled `useEffect` + `fetch` + separate loading/error `useState` boilerplate: it automatically handles caching by endpoint and arguments, deduplicates identical simultaneous requests, tracks loading/error states for you, and supports cache invalidation via **tags**, so a mutation (creating a new post, say) can automatically mark the "posts list" query as stale and trigger a refetch, with zero manual cache-management code.

```js
// RTK slice — reducer body LOOKS mutable, is actually fully immutable underneath thanks to Immer
const counterSlice = createSlice({
  name: 'counter',
  initialState: { value: 0 },
  reducers: {
    increment: state => { state.value += 1; },       // safe — Immer produces a new object
    incrementBy: (state, action) => { state.value += action.payload; }
  }
});
export const { increment, incrementBy } = counterSlice.actions; // auto-generated action creators
export default counterSlice.reducer; // auto-generated reducer
```

## Common Mistakes
- Putting frequently-changing, widely-read state (like live cursor position, or per-keystroke form state shared across a big tree) into a single large Context, causing every single consumer anywhere in the tree to re-render on every tiny change.
- Forgetting that Immer's "mutate it directly" ergonomics **only** work inside an RTK-generated reducer, attempting the same style of direct mutation anywhere else in the codebase produces a genuine, silent, hard-to-trace mutation bug.
- Not memoizing a Redux selector that performs a non-trivial computation (filtering, sorting, aggregating) over the store, causing that expensive work to rerun on every single render of every component using that selector, even when the relevant underlying state hasn't actually changed.
- Storing derived/computed data directly in the Redux store instead of computing it via a selector on demand, leading to the two copies drifting out of sync whenever the underlying source data changes but the derived copy isn't manually kept updated too.
- Splitting a single logical form's state across many independent `useState` calls rather than one state object plus a keyed `handleChange`, leading to repetitive, error-prone per-field boilerplate that only grows worse as fields are added.
- Skipping RTK Query's built-in tag-based cache invalidation and manually calling `refetch()` everywhere instead, reintroducing the exact cache-management complexity RTK Query exists to eliminate.

## Interview Questions
1. *What problem does Context solve, and precisely what does it not solve well?* It solves prop drilling cleanly, letting any descendant read a value without every intermediate component needing to know about or forward it. It does not solve high-frequency, widely-shared state well, since every consumer re-renders on any change to the Context value, with no built-in way to subscribe to just a slice of it.
2. *Why must a Redux reducer be a pure function, specifically?* Purity (same inputs always produce the same output, with zero side effects) is what makes the entire store's behavior predictable and testable in isolation, and it's a hard requirement for features like Redux DevTools' time-travel debugging, which works by replaying actions against reducers and expects deterministic results every time.
3. *What does Immer let you do inside an RTK slice that plain, classic Redux would never allow?* Write reducer logic using ordinary-looking direct mutation syntax (`state.value += 1`), while Immer, via a Proxy wrapping the draft state, silently tracks every mutation you make and produces a correct, brand-new, fully immutable state object once the reducer function returns, giving you the ergonomics of mutation with the actual guarantees of immutability.
4. *What does RTK Query give you "for free" over a hand-written `useEffect` + `fetch` approach?* Automatic request deduplication (identical simultaneous requests share one network call), built-in loading/error/success state tracking with zero manual `useState` boilerplate, automatic caching keyed by endpoint and arguments, and tag-based cache invalidation so related queries automatically refetch after a relevant mutation succeeds.
5. *Action vs. reducer, precisely, in one sentence each?* An action is a plain, serializable object describing *what happened* (an event, essentially, "user incremented the counter"); a reducer is a pure function that decides *how the store's state should change* in response to receiving that action.
6. *How does Immer let RTK reducers "mutate" state safely, mechanically?* Immer wraps the current state in a JavaScript Proxy (the "draft"), every property access or assignment you make against that draft is intercepted, Immer records exactly what changed, and once your reducer function finishes, Immer uses that recorded diff to construct a brand-new state object with structural sharing (unchanged parts of the tree are literally the same object references as before, only changed branches are new), rather than deep-cloning everything.
7. *How would you concretely reduce unnecessary re-renders caused by a widely-consumed Context?* Split one large context object into several smaller, more narrowly-scoped contexts, so a component that only cares about, say, the current theme subscribes only to a `ThemeContext`, and doesn't re-render just because some unrelated `UserContext` value changed.
8. *What does an RTK Query cache invalidation tag actually accomplish, mechanically?* You declare that a query "provides" certain tags (e.g., `{type: 'Post', id: 'LIST'}`) and that a mutation "invalidates" certain tags. When a mutation completes successfully, RTK Query checks which currently-cached queries provided any of the invalidated tags and automatically triggers a refetch for exactly those, and no others, avoiding both stale data and unnecessary network requests.
9. *Can you mutate Redux state directly outside of a `createSlice` reducer?* No, absolutely not safely, Immer's draft-Proxy mechanism is specifically wired into RTK's `createSlice` machinery, any direct mutation attempted elsewhere (a component, a thunk, a plain reducer not built with `createSlice`) is a genuine, uncaught mutation of shared state with no immutability guarantee whatsoever.
10. *Why should an expensive Redux selector be memoized, and with what?* Without memoization, a selector doing filtering, sorting, or aggregation reruns that full computation on literally every render of every component subscribed to it, even when the underlying state it reads hasn't changed at all. Libraries like `reselect` (or RTK's built-in `createSelector`) memoize based on the selector's actual inputs, only recomputing when those specific inputs change.
11. *Why is storing derived data directly in the Redux store generally considered an anti-pattern?* Because it introduces a second, separately-maintained copy of information that's fully computable from existing state, any place that mutates the source data now also has to remember to update the derived copy too, or the two silently drift out of sync, a selector computing the derived value on demand avoids this class of bug entirely by construction.
12. *What's the practical tradeoff between using Context+`useReducer` versus adopting a dedicated library like Redux Toolkit for state management?* Context+`useReducer` needs no extra dependency and works fine for moderate, moderately-updated shared state, but lacks built-in devtools, middleware, memoized selectors, and (crucially) Context's re-render-everything-on-any-change behavior remains a real limitation at larger scale, RTK adds real tooling and more surgical update propagation at the cost of an added dependency and slightly more setup.
13. *How would you structure form state for a form with a dynamically variable number of fields (like a list of tags a user can add/remove)?* Keep the dynamic collection as an array within the single form state object (`{tags: ['react', 'redux']}`), with add/remove handlers that create a new array (`setFormData(prev => ({...prev, tags: [...prev.tags, newTag]}))`) rather than mutating the array in place, and use the array's index or, ideally, a stable generated id as each dynamic field's React `key`.
14. *Give a concrete example where RTK Query's automatic deduplication actually matters in practice.* Two sibling components both independently calling the same `useGetPostsQuery()` hook on mount, without deduplication this would fire two identical, redundant network requests, RTK Query recognizes the identical endpoint+arguments combination and shares a single in-flight request and cached result between both components automatically.
15. *Why does RTK's official guidance discourage normalizing every single piece of Redux state into deeply nested slices unnecessarily?* Because excessive normalization for its own sake adds real complexity (extra selectors, extra join-like logic to reassemble related data for display) without a corresponding benefit unless the data genuinely has the kind of relational, frequently-updated-by-id shape that normalization is meant to solve, RTK's guidance favors normalizing specifically when you have collections of entities referenced from multiple places, not applying it dogmatically everywhere.

## Quick Test
- Why does a Context value change re-render more components than you might expect?
- What are the three pieces of a Redux data flow, in order?
- What does `createSlice` generate for you automatically?
- Name one situation where an uncontrolled input is unavoidable.
- What's the RTK Query equivalent of a `useEffect` fetch-on-mount pattern?
- How does Immer let a reducer look like it's mutating state safely?
- Name one way to reduce unnecessary re-renders caused by Context.
- What does an RTK Query cache tag actually link together?
- Can you mutate state outside a `createSlice` reducer?
- Why would you memoize a Redux selector?
- Why is storing derived data directly in the Redux store usually an anti-pattern?
- What's the tradeoff between Context+useReducer and adopting Redux Toolkit?
- How would you structure form state for a dynamically-growable list of fields?
- Give a real example where RTK Query's request deduplication actually helps.
- Why does RTK's guidance discourage normalizing every slice of state unconditionally?

<script type="text/markdown" data-group="React" data-id="react-5" data-title="Performance &amp; Advanced Patterns">
## Core Concepts
`React.memo(Component)` skips re-rendering a component entirely if its props are shallow-equal to the props from its previous render, "shallow" meaning exactly one level deep, `Object.is` comparison per individual prop. This is precisely why an inline object, array, or function literal passed as a prop (`style={{color: 'red'}}`, or an unwrapped arrow function handler) defeats `memo`'s entire purpose, a new reference is created on every parent render regardless of whether the actual contents are identical, always failing the shallow comparison. `React.memo` accepts an optional second argument, a custom comparison function, letting you implement a deeper or different equality check, at the real cost of added complexity and the genuine risk of a bug where your custom comparator quietly misses a field that actually did change, silently preventing a needed re-render. `React.lazy(() => import('./Component'))` combined with `<Suspense fallback={...}>` enables code-splitting at the component level, that component's JavaScript bundle is only downloaded when it's actually needed, shrinking the initial bundle at the cost of a brief loading state the first time that code path is reached.

**Error boundaries** are a class-component-only feature (there is still no hook equivalent as of today), implemented via the `static getDerivedStateFromError()` lifecycle method (used to update state and render a fallback UI) and `componentDidCatch(error, info)` (used for logging/reporting the error). Critically, error boundaries only catch errors thrown during **rendering**, in **lifecycle methods**, and in **constructors** of the component tree below them, they do **not** catch errors thrown inside event handlers (a click handler that throws needs its own local `try/catch`), inside asynchronous code (a rejected promise inside a `useEffect`), during server-side rendering, or errors thrown by the error boundary component itself.

```jsx
class ErrorBoundary extends React.Component {
  state = { hasError: false };
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, info) { logErrorToService(error, info); }
  render() {
    return this.state.hasError ? <FallbackUI /> : this.props.children;
  }
}
```

**Portals** (`createPortal(children, domNode)`) render a subtree of React children into a DOM node that lives **outside** the parent component's actual DOM hierarchy, while that subtree still fully participates in React's normal event bubbling and Context resolution *as if* it were nested in its original logical position in the tree. This is the standard, correct solution for modals, tooltips, and dropdowns that need to visually escape a parent's `overflow: hidden` or a restrictive `z-index` stacking context, without giving up React's normal component composition and event handling.

**forwardRef** solves a specific problem: `ref` is not treated as an ordinary prop by React, so a custom component can't simply receive and forward a `ref` the way it would any other prop, `forwardRef(props, ref) => ...` explicitly opts a component into receiving a `ref` from its parent and lets it attach that ref to whichever underlying DOM node or class instance it chooses.

**HOCs** (Higher-Order Components, functions that take a component and return an enhanced version wrapping it) and **render props** (a prop whose value is a function controlling what gets rendered, receiving some data or behavior as its arguments) were the primary pre-hooks patterns for sharing cross-cutting logic between unrelated components. Both have been substantially superseded by **custom hooks**, since hooks compose logic without adding extra wrapper components to the tree (avoiding both "wrapper hell" in DevTools and the very real risk of prop-name collisions between multiple stacked HOCs), though HOCs and render props still appear in older codebases and are worth recognizing.

**Compound components** (a pattern like `<Select><Select.Option value="a">A</Select.Option></Select>`) share implicit state between a parent component and its specifically-named children via Context internally, giving consumers a clean, declarative API (`<Select>` and its `<Select.Option>` children just work together) while hiding the actual state-sharing plumbing entirely from whoever's using the component.

## Common Mistakes
- Wrapping a component in `React.memo` but still passing it a fresh inline object, array, or arrow function as a prop from the parent on every render, completely negating the memoization since the prop reference is always "new."
- Expecting an error boundary to catch an error thrown inside an `onClick` handler, or inside a `.then()`/`async` callback, it categorically will not, those situations need their own local `try/catch`.
- Overusing `useMemo`/`useCallback` reflexively on genuinely cheap computations or rarely-re-rendering components, the memoization bookkeeping itself carries a small but real cost, and can actively hurt code readability for zero measurable performance benefit.
- Using a portal purely for CSS positioning convenience on something that doesn't actually need to escape a stacking/overflow context, adding unnecessary architectural complexity for a problem plain CSS (or a simple `position: fixed`) could have solved.
- Stacking many HOCs on one component ("wrapper hell"), making the resulting component tree in DevTools deeply nested and genuinely hard to read, and risking silent prop-name collisions where two HOCs happen to inject a prop with the same name.
- Writing a custom `React.memo` comparator that only checks a subset of the actual props being used inside the component, silently preventing a necessary re-render when an unchecked prop changes.

## Interview Questions
1. *Why doesn't `React.memo` prevent a re-render if the parent passes an inline arrow function as a prop?* Because a new function object is created by the parent on literally every render, and `React.memo`'s default shallow comparison checks prop references, not their behavior, a brand-new function reference always fails that check regardless of whether the function's logic is identical to before, unless the parent wraps it in `useCallback` to preserve a stable reference across renders.
2. *What specifically can't an error boundary catch?* Errors inside event handlers (need local `try/catch`), errors in asynchronous code like promises or `setTimeout` callbacks (the boundary has already finished its synchronous render work by the time the error occurs), errors during server-side rendering, and errors thrown by the error boundary component itself while rendering its fallback.
3. *Why use a portal for a modal instead of just rendering it in its normal tree position?* A modal deeply nested inside a component with `overflow: hidden` or a constrained `z-index` stacking context can be visually clipped or layered incorrectly no matter what CSS you apply to the modal itself, a portal renders the modal's actual DOM elsewhere (commonly directly under `<body>`), sidestepping those ancestor CSS constraints entirely, while React's event bubbling and Context still behave as if it were in its original logical tree position.
4. *HOC vs. custom hook, precisely why did hooks largely replace HOCs for sharing logic?* An HOC wraps a component in an additional component layer to inject shared behavior, stacking several HOCs creates several extra layers in the component tree (harder to read in DevTools) and risks prop-name collisions between HOCs injecting similarly-named props. A custom hook shares the exact same kind of logic without adding any extra component or wrapper at all, it's just a function call inside your existing component.
5. *When is virtualization (rendering only visible rows of a long list) genuinely worth its added complexity?* When a list is long enough (hundreds to thousands of items) that rendering every single row up front measurably hurts initial render time or scroll performance, for short or moderate lists, the added complexity of a virtualization library isn't justified by any measurable benefit.
6. *Why precisely does an inline object prop defeat `React.memo`'s default comparison?* `React.memo`'s default check is a shallow, one-level `Object.is` comparison per prop. An inline object literal (`{color: 'red'}`) is a freshly allocated object on every render, even with byte-for-byte identical contents to the previous render's object, `Object.is` compares references for objects, not their contents, so it's always considered "different."
7. *What can a custom `React.memo` comparator do that the default shallow check fundamentally can't?* It can implement a deeper equality check (comparing the actual contents of a nested object prop, for example) or deliberately ignore certain props entirely when deciding whether to re-render, at the real risk that an incorrectly-written comparator silently skips a re-render that should have happened, a subtle, hard-to-spot class of bug.
8. *Why won't an error boundary catch an error thrown inside a button's `onClick` handler?* Because error boundaries specifically hook into React's rendering and lifecycle machinery (`getDerivedStateFromError`/`componentDidCatch`), an event handler runs outside of that render cycle entirely, as a direct response to a browser event, any error it throws is a completely separate, uncaught JavaScript exception from the boundary's perspective.
9. *When is `useMemo`/`useCallback` genuinely not worth using?* On cheap computations (simple arithmetic, short string operations) or in components that rarely re-render in the first place, the bookkeeping cost of memoization (storing the previous dependencies, comparing them each render) can exceed the cost of just recomputing the cheap value directly, while also adding a dependency array that needs to be kept correct.
10. *What's the concrete tradeoff of splitting code with `React.lazy` + `Suspense`?* A smaller initial JavaScript bundle, since the lazily-loaded component's code isn't downloaded until it's actually needed, at the cost of a brief loading state (the `Suspense` fallback) the very first time a user's session reaches that code path, a worthwhile tradeoff for large, infrequently-visited parts of an app (a settings page, an admin panel).
11. *Give a concrete, realistic scenario for using the compound component pattern instead of a single component with many boolean/config props.* A `<Tabs>` component with `<Tabs.List>`, `<Tabs.Tab>`, and `<Tabs.Panel>` children, letting consumers freely rearrange, style, or conditionally include specific tabs/panels declaratively in JSX, versus a single monolithic `<Tabs tabs={[...]} panels={[...]} />` API that becomes awkward the moment you need per-tab custom rendering or conditional inclusion logic.
12. *How does `forwardRef` actually solve the "ref isn't a normal prop" problem, mechanically?* `ref` is intercepted specially by React itself before props are even passed to a function component, a plain function component receives `props` but never `ref`. `forwardRef((props, ref) => ...)` gives your component a second parameter specifically for that intercepted ref, letting you explicitly attach it to whichever inner DOM node or component instance makes sense.
13. *Why might a `useCallback`'s own dependency array itself become a subtle bug source?* If the dependency array is missing a value the callback's body actually closes over, the memoized function keeps referencing stale data from whenever it was last recreated, the exact same "stale closure" problem `useEffect` has, `useCallback` doesn't magically avoid it, it just applies the same dependency-array discipline to a memoized function instead of an effect.
14. *What's the actual mechanism that lets a portal's children still respond to Context providers defined in their original logical tree position, even though they render into a totally different DOM location?* React's Context resolution, and its synthetic event bubbling, both operate on the React element tree (the "virtual" logical structure), not the literal DOM tree. A portal changes only where the resulting DOM nodes physically live, it does not detach that subtree from React's own internal tree structure at all.
15. *Give an example where overusing `React.memo` everywhere could actually make an app slower, not faster.* Wrapping every single small, cheap-to-render component in `React.memo` adds a prop-comparison check before every potential render, for components that are genuinely trivial to render and rarely receive unnecessary re-renders anyway, that comparison overhead, multiplied across a very large number of small memoized components, can exceed the savings from the renders it actually manages to skip.

## Quick Test
- What causes `React.memo` to still re-render despite unchanged primitive props?
- Name two things an error boundary cannot catch.
- What DOM API problem does a portal solve?
- What's the modern replacement for most HOC/render-prop use-cases?
- What does the Profiler actually measure?
- Why does an inline object or array prop defeat `React.memo`'s default comparison?
- What can a custom `React.memo` comparator do that the default shallow check can't?
- Why won't an error boundary catch an error thrown inside an `onClick` handler?
- Name one situation where `useMemo`/`useCallback` isn't actually worth using?
- What's the tradeoff of splitting code with `React.lazy` + `Suspense`?
- Give a realistic scenario favoring compound components over a config-prop-heavy API.
- How does `forwardRef` solve the problem of `ref` not being an ordinary prop?
- Why can a `useCallback`'s dependency array introduce the same stale-closure bug as `useEffect`?
