<script type="text/markdown" data-group="JavaScript" data-id="js-1" data-title="Execution Context, Scope &amp; Hoisting">
## Core Concepts
When a JS engine runs your file, it doesn't execute line by line blind. It first creates a **Global Execution Context (GEC)**: a memory space with a `this` binding, a reference to the global object, and an outer environment reference (`null` for global). Every function call creates its own **Function Execution Context (FEC)**, pushed onto the **call stack**. When a function returns, its context is popped off the stack, and if nothing else references its variables, they become eligible for garbage collection.

Each context has two phases. In the **creation phase**, the engine walks through the code without running it, allocating memory for every `var`, function declaration, and `let`/`const` binding it finds in that scope, this is what people call **hoisting**. In the **execution phase**, the code actually runs top to bottom, and variables get their real assigned values.

`var` declarations are hoisted and initialized to `undefined` immediately during creation, that's why reading a `var` before its line executes gives `undefined` rather than an error. `let` and `const` are hoisted too (the engine knows they exist), but they are **not initialized**, they sit in the **Temporal Dead Zone (TDZ)** from the top of their block until the actual declaration line runs. Touching them before that point, even with `typeof`, throws a `ReferenceError`. `var` is **function-scoped** (it only respects function boundaries, not `if`/`for`/block boundaries); `let`/`const` are **block-scoped** (they respect every pair of curly braces).

Function declarations (`function foo(){}`) are hoisted completely, name and body, so you can call them before their line in the file. Function *expressions* (`const foo = function(){}`) and arrow functions are not hoisted the same way, only the variable binding hoists (as `undefined` for `var`, or into the TDZ for `let`/`const`), the function body itself isn't available until that assignment line runs. `class` declarations behave like `let`, they're hoisted into the TDZ and throw if referenced before the class body executes, this surprises people who assume classes behave like function declarations.

The **scope chain** is what lets an inner function see outer variables. It's resolved **lexically**, meaning by where the code is physically written in the file, not by which function happened to call it. This is the foundation closures are built on (covered in the next topic): a function always "remembers" the scope it was written inside, no matter where it's later invoked from.

```js
console.log(a); // undefined (hoisted, not yet assigned)
var a = 10;

console.log(b); // ReferenceError: Cannot access 'b' before initialization
let b = 10;

{
  console.log(typeof x); // ReferenceError — TDZ blocks even typeof, unlike a truly undeclared variable
  let x = 5;
}

foo(); // works — function declarations hoist fully, body included
function foo() { console.log('hoisted'); }

bar(); // TypeError: bar is not a function — only the name hoists for var, not the assignment
var bar = function() { console.log('not hoisted'); };
```

A classic gotcha combines hoisting with `switch` statements: a `switch` block is a single block, so a `let` declared in one `case` is visible (but possibly uninitialized) in every other `case` of the same `switch`, leading to `SyntaxError`s or TDZ errors that surprise people who think each `case` is its own scope.

```js
switch (value) {
  case 1:
    let result = 'one'; // this `let` belongs to the WHOLE switch block
    break;
  case 2:
    let result = 'two'; // SyntaxError: Identifier 'result' has already been declared
    break;
}
```

The classic `var` loop bug deserves a full walk-through because it comes up constantly: `for (var i=0;i<3;i++){ setTimeout(()=>console.log(i)) }` prints `3 3 3`. This is because `var` is function-scoped, there is only **one** `i` variable for the entire loop, shared by all three `setTimeout` callbacks, and by the time any of them run (after the loop has already finished, since timers are asynchronous), `i` is `3`. Switching to `let` prints `0 1 2`, because the spec special-cases `let` in `for` loops: each iteration gets a **fresh copy** of the loop variable, so each closure captures its own separate binding.

## Common Mistakes
- Assuming `typeof someVar` is always safe on an undeclared name, it throws instead inside that name's TDZ.
- Mixing `var` and `let` for the same logical variable across a function, produces inconsistent hoisting behavior and can trigger confusing redeclaration errors.
- Forgetting that a function *expression* assigned to `let`/`const` does not hoist its body, only a function *declaration* does.
- Declaring the same `var` name twice in one function expecting an error, JS silently allows it, the second declaration just overwrites the first's value when it runs.
- Assuming each `case` in a `switch` is its own block scope, `let`/`const` declared in one `case` leaks into siblings.
- Treating `class` declarations as hoisted the same way `function` declarations are, classes are hoisted into a TDZ just like `let`.

## Interview Questions
1. *What's the difference between the creation and execution phase?* Creation allocates memory and hoists declarations (function bodies fully, `var` as `undefined`, `let`/`const` as uninitialized); execution runs the code top to bottom and performs the actual assignments and logic.
2. *Why does `let` throw but `var` doesn't, when both are hoisted?* Both are hoisted in the sense that the engine knows about them ahead of time, but `var` is immediately initialized to `undefined`, so reading it early just gives a "missing" value. `let`/`const` are deliberately left uninitialized until their declaration line runs, so the engine can enforce that you never read a value before it logically exists.
3. *Is `let` "not hoisted"?* No, that's a common misconception. It IS hoisted to the top of its block, it's just left uninitialized (in the TDZ) rather than set to `undefined` like `var`.
4. *What decides scope, call-site or write-site?* Write-site. JavaScript uses lexical (static) scoping, a function's access to outer variables is fixed by where it's defined in the source code, not by the call stack at the moment it runs.
5. *Walk through the classic `var` loop trap and its fix.* `for (var i=0;i<3;i++){ setTimeout(()=>console.log(i)) }` prints `3 3 3` because all three callbacks close over the same function-scoped `i`, which is `3` by the time any timer fires. Switching `var` to `let` prints `0 1 2` because the spec gives each loop iteration its own fresh `let` binding.
6. *Does hoisting move code, or just declarations?* Nothing physically moves. The engine processes declarations during a lookahead pass (the creation phase) before executing any statements, producing the same practical effect as if declarations were moved to the top, without actually rearranging anything.
7. *Can you read a `var` declared later in the same function before its line runs?* Yes, but it evaluates to `undefined` until the assignment line actually executes.
8. *Why does per-iteration scoping matter specifically for `let` in loops?* Without it, every closure created inside the loop body would share one binding and all see the final value after the loop ends, exactly the `var` bug. Per-iteration binding gives each closure its own snapshot, which is almost always what you actually want.
9. *What happens with `let x = x;` where no outer `x` exists?* `ReferenceError`. The right-hand `x` refers to the very `let` being declared on that same line, and it's still inside its own TDZ at the point the right-hand side is evaluated.
10. *Why is `const` still block-scoped rather than just "an immutable `var`"?* Scoping (block vs. function) and mutability (reassignable vs. fixed binding) are two independent axes of behavior. `const` happens to share `let`'s block-scoping rules and additionally forbids reassignment, but it isn't simply "var with a lock on it," it never had function-scoping or hoisting-to-undefined behavior in the first place.
11. *Why does a `let` inside one `case` of a `switch` cause a syntax error if redeclared in another `case`?* A `switch` statement's body is a single block, not one block per `case`. All `case` clauses share that one block scope, so declaring the same `let` name in two different `case`s is a duplicate declaration in the same scope.
12. *Are `class` declarations hoisted the same way function declarations are?* No. `class` declarations are hoisted into a Temporal Dead Zone, just like `let`/`const`, referencing a class before its definition line throws a `ReferenceError`, unlike a fully-hoisted `function` declaration which you can call early.
13. *What's the Temporal Dead Zone, formally?* The span of code, within a block, from the start of that block to the point where a `let`/`const`/`class` binding is actually declared, during which accessing that binding throws instead of returning `undefined`.
14. *Why might strict mode change hoisting-related bugs?* Strict mode doesn't change hoisting itself, but it turns certain silent mistakes (like assigning to an undeclared variable, which would otherwise create an accidental global) into thrown errors, surfacing bugs that hoisting quirks might otherwise hide.
15. *Give an example where hoisting causes a bug that's hard to spot in code review.* A `var` declared deep inside a nested `if` block inside a function is still hoisted to the top of the whole function. A reviewer skimming the top of the function won't see it declared there, but it's already in scope and `undefined` at that point, easy to accidentally shadow or misuse.

## Quick Test
- What are the three things a GEC holds at creation?
- What error does the TDZ produce, and is it the same as `undefined`?
- Is `const` reassignable? Is it mutable?
- What does "lexical" mean in "lexical scope"?
- Rewrite the `var` loop trap with an IIFE instead of `let`, and explain why it works.
- What's the difference between hoisting a function declaration and a function expression?
- Does `typeof` throw inside the TDZ, and what does that tell you about how the TDZ works?
- Is a `let` inside a `for` loop's parentheses a fresh binding per iteration, or one binding for the whole loop?
- What's the difference between the call stack and the scope chain?
- Name one bug you'd expect from declaring the same variable name with `var` twice in one function.
- Why does a `let` declared inside one `case` of a `switch` sometimes throw a redeclaration error from another `case`?
- Are `class` declarations hoisted the same way as `function` declarations?
- What's the practical difference between "hoisting" as a mental model and what the engine actually does?
- Why might strict mode surface a bug that hoisting was quietly hiding?
- Predict the output: `function foo(){ console.log(x); var x = 1; } foo();`
