<script type="text/markdown" data-group="JavaScript" data-id="js-2" data-title="Functions, this &amp; Closures">
## Core Concepts
Functions in JavaScript are **first-class citizens**: they can be stored in variables, passed as arguments to other functions, and returned from functions. A function that takes another function as an argument or returns one is called a **higher-order function** (`map`, `filter`, `setTimeout` are all higher-order functions). Function *declarations* are fully hoisted; function *expressions* and arrow functions are not, only the variable they're assigned to hoists.

**`this`** is one of the most misunderstood parts of JavaScript because, unlike most languages, it isn't determined by where a function is *defined*, it's determined by *how the function is called*, a concept called "call-site binding":

- **Plain call** (`foo()`): `this` is `undefined` in strict mode (most modules and classes are strict by default), or the global object in loose mode.
- **Method call** (`obj.foo()`): `this` is `obj`, whatever object appears to the left of the dot at the call site.
- **Constructor call** (`new Foo()`): `this` is the brand-new object being constructed.
- **Explicit binding** (`foo.call(ctx)`, `foo.apply(ctx)`, `foo.bind(ctx)`): `this` is whatever you explicitly pass in.
- **Arrow functions have no `this` of their own.** They don't participate in any of the rules above at all, instead they capture `this` lexically from whatever scope they were *written inside*, permanently, at creation time. This is precisely the feature that fixed the classic "lost `this` inside a callback" bug that plagued pre-ES6 JavaScript and early React class components (`this.handleClick.bind(this)` in a constructor was the old workaround; an arrow class field skips the need entirely).

**Closures** are the single most-tested JavaScript concept in interviews, and for good reason: a huge amount of idiomatic JS (module patterns, memoization, event handlers, React hooks under the hood) relies on them. A closure is what happens when an inner function is used after its outer function has already returned, that inner function still has full access to the outer function's variables, because the JS engine keeps those variables alive on the heap as long as something can still reach them through the scope chain.

```js
function counter() {
  let count = 0;
  return function () {
    count++;
    return count;
  };
}
const c = counter();
c(); // 1
c(); // 2 — the same `count` variable, kept alive by the closure, not reset each call
```

It's important to internalize that a closure captures a **live binding**, not a frozen snapshot. If two closures share the same outer variable, updating it through one is visible through the other, they're not independent copies.

Common, genuinely useful patterns built on closures: the **module pattern** (an IIFE or factory function that returns an object exposing only certain methods, keeping internal state truly private, unreachable from outside code); **memoization** (caching a function's results keyed by its arguments, in a closure-held cache object); and **partial application/currying** (pre-filling some arguments of a function and returning a new function waiting for the rest).

```js
// Module pattern: closures for genuine data privacy
function createBankAccount(initialBalance) {
  let balance = initialBalance; // truly private — no way to reach it except through these methods
  return {
    deposit: amt => balance += amt,
    withdraw: amt => { if (amt <= balance) balance -= amt; },
    getBalance: () => balance
  };
}
const acct = createBankAccount(100);
acct.deposit(50);
acct.getBalance(); // 150 — `balance` itself is never exposed
```

Because an arrow function permanently captures `this` at definition time, calling `.call()`, `.apply()`, or `.bind()` on one to try to change its `this` has **absolutely no effect**, a favorite "gotcha" interview question, because people assume these three methods always work on any function.

```js
const arrow = () => console.log(this);
arrow.call({ name: 'ignored' }); // still logs the outer lexical `this` — call() does nothing here

const obj = {
  name: 'Widget',
  // BUG: arrow function has no own `this`, grabs the outer (often global/undefined) `this` instead
  logBad: () => console.log(this.name),
  // FIX: regular method shorthand correctly binds `this` to `obj` at call time
  logGood() { console.log(this.name); }
};
obj.logBad();  // undefined (or throws in strict mode)
obj.logGood(); // 'Widget'
```

## Common Mistakes
- Believing `bind`/`call`/`apply` can override an arrow function's `this`, they cannot, ever, under any circumstance.
- Writing object methods as arrow function properties when the method needs `this` to refer to the object at call time, use a regular function or ES6 method shorthand instead.
- Treating a closure as capturing a *value* rather than a *reference*, mutating the outer variable after the closure is created still changes what every closure over it sees.
- Overusing closures to hold references to large objects or DOM nodes long after they're needed, quietly preventing garbage collection.
- Confusing `arguments` (array-like, no arrow function support) with rest parameters (a real array, works everywhere), and trying to use array methods directly on `arguments`.
- Forgetting that default parameter values are evaluated in their own scope, which can itself have TDZ interactions with earlier parameters.

## Interview Questions
1. *Why is `count` still alive after `counter()` returns?* Because the function returned by `counter()` still references `count` through the scope chain, and the JS engine only garbage-collects memory that's completely unreachable. As long as that returned function exists, `count` is reachable and therefore kept alive.
2. *Pure function vs. one with side effects?* A pure function always returns the same output for the same input and doesn't touch anything outside itself (no mutating arguments, no I/O, no reading external mutable state). A function with side effects might log, mutate a shared object, make a network call, or otherwise affect the world beyond its return value, making it harder to test and reason about.
3. *Why do arrow functions break as object methods needing dynamic `this`?* An arrow function doesn't create its own `this` binding at all, it looks up `this` in its enclosing lexical scope, exactly like it would look up any other variable. If that enclosing scope is the module or global scope (as it usually is for an object literal), `this` inside the arrow won't be the object the method is attached to.
4. *Write a `once(fn)` that only lets `fn` run one time.* `function once(fn) { let called = false, result; return (...args) => { if (!called) { called = true; result = fn(...args); } return result; }; }` — the closure over `called` and `result` persists across calls.
5. *Difference between `arguments` and rest parameters?* `arguments` is an array-like object (has indices and `.length` but no array methods like `.map`) available in regular functions but not arrow functions. Rest parameters (`...args`) collect the extra arguments into a genuine array, work in every function type including arrows, and can be named meaningfully.
6. *Can `call`/`bind` change an arrow function's `this`? Why or why not?* No. Arrow functions never create their own `this` binding to begin with, there's nothing for `call`/`apply`/`bind` to override, they always resolve `this` lexically from where they were defined, regardless of how they're invoked.
7. *What's the difference between a closure and just a nested function?* Every nested function technically has lexical access to its outer function's variables while the outer function is still running. The term "closure" specifically describes the situation where that access persists *after* the outer function has already returned, the variables are kept alive purely because the inner function still references them.
8. *Implement a simple private counter module using closures.* A factory function (or IIFE) that declares a local variable and returns an object of methods that read/write it, exactly as in the bank account example, since nothing outside those methods can reach the variable directly, it's genuinely private, unlike a `_prefixed` convention.
9. *Why might overusing closures cause a memory leak?* If a long-lived closure (e.g., an event listener that's never removed) keeps a reference to a large object or DOM subtree it no longer actually needs, that object can never be garbage-collected for as long as the closure itself is reachable, even if the rest of the program has moved on.
10. *What does "first-class functions" mean, concretely?* It means functions are treated as ordinary values in the language: they can be assigned to variables, stored in data structures, passed as arguments, and returned from other functions, exactly like a number or string could be.
11. *Predict the output:* `const obj = { name: 'A', greet: () => console.log(this.name) }; obj.greet();` — logs `undefined` (or throws in strict mode accessing `.name` on `undefined`), because the arrow function's `this` was captured from the surrounding module/global scope at definition time, not from `obj`.
12. *How would you implement basic currying for a two-argument function?* `const curry = fn => a => b => fn(a, b);` — each call returns a new function that closes over the argument(s) already supplied, waiting for the rest.
13. *What's a practical, real-world use of the module pattern beyond a toy counter example?* Encapsulating a piece of app configuration or a cache that only certain exposed functions should be allowed to read or mutate, preventing other parts of a large codebase from reaching in and corrupting internal state directly.
14. *Why does a regular `function` keyword method fix the arrow-function `this` bug, but a class field arrow function is sometimes intentionally used instead?* A regular method binds `this` dynamically based on the call site, which is correct for normal method calls. But when a method is passed around as a callback (e.g., an event handler) and might be called without its original object context, an arrow class field deliberately locks in `this` at creation time, trading dynamic binding for guaranteed correctness in that specific scenario.
15. *What's the risk of naively memoizing a function that takes an object as an argument?* Using the object itself as a cache key (e.g., in a plain object whose keys get stringified) can cause incorrect cache hits if two different objects happen to stringify the same way, or cache misses that never clean up if objects are never reused, a `WeakMap` keyed by the object reference itself avoids both issues.

## Quick Test
- What's hoisted differently between a function declaration and a function expression?
- Name two practical use-cases for closures beyond counters.
- What does an arrow function use for `this` if it has none of its own?
- Predict the output: `const obj = { name: 'A', greet: () => console.log(this.name) }; obj.greet();`
- Implement `memoize(fn)` using a closure over a cache object.
- Why does calling `.bind()` on an arrow function have no effect?
- What's the difference between a plain nested function and a closure, precisely?
- Give one real cause of a memory leak involving closures.
- What's a pure function, and why do they matter for testing?
- Write `once(fn)` from scratch.
- Implement `curry` for a two-argument function using nested arrow functions.
- Why is `arguments` unavailable inside an arrow function?
- What's a genuine advantage of the module pattern over a simple `_prefixed` convention for "private" fields?
- Why might you deliberately choose an arrow class field over a regular method?
- What risk does memoizing with an object argument as a plain-object cache key introduce?
</script>

<script type="text/markdown" data-group="JavaScript" data-id="js-3" data-title="Objects &amp; Prototypes">
## Core Concepts
`call(thisArg, ...args)`, `apply(thisArg, argsArray)`, and `bind(thisArg, ...args)` are the three explicit ways to control what `this` refers to inside a function. `call` and `apply` invoke the function immediately, they differ only in how you pass arguments (individually vs. as an array). `bind` doesn't invoke anything, it returns a brand-new function with `this` permanently locked to whatever you passed, useful for handing a method off as a callback without losing its intended object context.

**Objects** support several ways of shaping and accessing data: dot notation for known keys, bracket notation for dynamic keys, computed property names (`{[dynamicKey]: value}`) for building keys at object-creation time, and **destructuring** (`const {a, b: renamedB, ...rest} = obj`) for cleanly extracting values, including renaming and collecting the remainder. `Object.assign({}, obj)` and the spread operator (`{...obj}`) both perform a **shallow copy**, only the top-level properties are duplicated, any nested object or array is still shared by reference between the original and the copy. A true **deep copy** needs `structuredClone(obj)` (built into modern JS engines) or a recursive/library-based approach for older environments. Under the hood, every property has a **property descriptor** controlling `writable` (can it be reassigned), `enumerable` (does it show up in `for...in`/`Object.keys`), and `configurable` (can it be deleted/redefined), this is the machinery that getters, setters, and "hidden" properties are built on.

**Prototypes** are how JavaScript implements inheritance. Every object carries an internal `[[Prototype]]` reference (exposed, non-standardly but almost universally, as `__proto__`), and these references chain together into the **prototype chain**. When you access `obj.someProperty`, the engine checks `obj`'s own properties first, and if not found, walks up `__proto__` to the next object in the chain, and the next, until it finds the property or reaches `null` (the end of every chain). `prototype` is a property that exists on **functions** specifically, it's the object that will become the `[[Prototype]]` of anything created with `new SomeFunction()`. `Object.create(proto)` lets you set an object's prototype directly, without going through a constructor at all. The ES6 `class` syntax is entirely **sugar** over this same prototype mechanism, `class Dog extends Animal` sets `Dog.prototype.__proto__` to `Animal.prototype` behind the scenes.

```js
function Animal(name) { this.name = name; }
Animal.prototype.speak = function() { return `${this.name} makes a sound`; };
const dog = new Animal('Rex');
dog.speak(); // found via the prototype chain, not as dog's own property

// new Foo() is roughly equivalent to:
function customNew(Ctor, ...args) {
  const obj = Object.create(Ctor.prototype);
  const result = Ctor.apply(obj, args);
  return (typeof result === 'object' && result !== null) ? result : obj;
}
```

`get`/`set` accessor properties let you run arbitrary logic on property read/write while keeping normal property syntax at the call site, useful for computed values, validation, or logging changes without the caller needing to know it's not a plain data property.

```js
const person = {
  first: 'A', last: 'B',
  get fullName() { return `${this.first} ${this.last}`; },
  set fullName(value) { [this.first, this.last] = value.split(' '); }
};
person.fullName = 'New Name'; // runs the setter, splits into first/last
console.log(person.first);    // 'New'
```

A subtlety worth knowing: property lookup on the prototype chain **always stops at the first match**, closer wins. An object's own property always shadows a same-named property further up the chain, this is effectively how method overriding works in prototype-based inheritance, and it's exactly what `class` method overriding compiles down to.

## Common Mistakes
- Borrowing a prototype method with `call`/`apply` onto an object that's missing properties the method internally assumes exist, causing silent `undefined` bugs or thrown errors deep inside the borrowed method.
- Assuming `Object.assign`/spread clone nested objects, they don't, only the top level is copied, a very common source of accidental shared-state bugs in React state updates.
- Modifying `Array.prototype` or `Object.prototype` globally ("monkey-patching" a built-in), affects every object and array in the entire program, including third-party library internals, almost never a good idea in production code.
- Forgetting that `for...in` iterates inherited enumerable properties too, not just an object's own properties, leading to unexpected keys showing up when iterating over an object that has a non-trivial prototype chain.
- Comparing two objects with `===` expecting a structural/content comparison, object equality is always by reference, two objects with identical contents are never `===` equal.
- Assuming `Object.freeze` makes an entire nested structure immutable, it only freezes the object's own top-level properties.

## Interview Questions
1. *Difference between `prototype` and `__proto__`?* `prototype` is a property that lives on constructor **functions** and serves as the template/blueprint object; `__proto__` is the actual link that lives on **instances**, pointing back to whichever object served as their prototype. Confusingly similar names, very different roles.
2. *When would you use `bind` over `call`?* When you need a reusable function reference with `this` permanently fixed for later invocation, for example, passing an object method as an event handler callback (`button.addEventListener('click', this.handleClick.bind(this))`) rather than calling it immediately.
3. *Shallow vs. deep copy, why does it matter?* A shallow copy duplicates only the top level, mutating a nested object inside a "copy" still mutates the original too, since both point at the same nested object. This is a classic source of accidental state mutation bugs, especially in frameworks like React that rely on reference-equality checks to detect changes.
4. *What does `Object.create(null)` give you, and why use it?* An object with absolutely no prototype, meaning it doesn't inherit `toString`, `hasOwnProperty`, or anything else from `Object.prototype`. It's useful for building a "pure" dictionary/map where you never want prototype pollution or accidental collisions with inherited method names as keys.
5. *How does method lookup actually work?* The engine first checks whether the object itself has the requested property as an own property. If not, it follows `[[Prototype]]` to the next object in the chain and repeats, continuing until the property is found or the chain ends at `null`, at which point the result is `undefined`.
6. *What does `new Foo()` do, step by step?* (1) Create a brand-new plain object. (2) Set that object's `[[Prototype]]` to `Foo.prototype`. (3) Run `Foo`'s function body with `this` bound to the new object. (4) Return the new object, unless `Foo` itself explicitly returns a different object, in which case that object is returned instead.
7. *Why does modifying a shared prototype method affect every instance?* All instances share the exact same prototype object in memory, they don't each get their own copy of prototype methods. Changing `Animal.prototype.speak` changes what every existing and future `Animal` instance sees when it looks up `.speak`.
8. *What's a getter/setter used for that a plain property can't do?* Running arbitrary logic (computation, validation, logging, triggering a side effect) transparently whenever a property is read or assigned, while the calling code still uses ordinary property syntax and has no idea it's not a plain data property.
9. *Why is `Object.freeze` shallow?* Because freezing only sets property descriptors (`writable: false`, etc.) on the object's own top-level keys. If one of those keys holds a reference to another object, that nested object's own properties are untouched by the freeze and remain fully mutable.
10. *Is `class` real classical inheritance?* No. It's syntax sugar layered over the same prototype-chain mechanism that's always existed in JavaScript. `class Dog extends Animal` is, under the hood, setting up the same `[[Prototype]]` links you'd get from manually writing constructor functions and `Object.setPrototypeOf` calls.
11. *What's the difference between an object's own property and an inherited property, in terms of `Object.keys()` vs. `for...in`?* `Object.keys()` (and `Object.entries`, `Object.values`) only returns the object's **own** enumerable properties. `for...in` walks the **entire prototype chain**, returning own AND inherited enumerable properties, unless you explicitly filter with `hasOwnProperty`.
12. *Why is comparing two objects with `===` almost never what a beginner expects?* Because `===` for objects (and arrays, functions) always compares **references**, not contents. Two separately-created objects with identical key/value pairs are never `===`, only comparing an object to itself (the same reference) returns `true`.
13. *What's the difference between `Object.create(proto)` and calling a constructor with `new`?* `Object.create(proto)` sets the prototype directly with no function execution involved at all, no constructor logic runs. `new Ctor()` does everything `Object.create` does, plus it actually invokes `Ctor`'s function body against the new object.
14. *How would you safely check if a property exists directly on an object, ignoring the prototype chain?* `Object.prototype.hasOwnProperty.call(obj, 'key')`, calling it via `Object.prototype` (rather than `obj.hasOwnProperty`) guards against the rare case where `obj` was created with `Object.create(null)` and has no `hasOwnProperty` method inherited at all.
15. *Give a concrete example of when prototype-chain shadowing is genuinely useful, not just a gotcha.* Overriding a default method for a specific instance without touching the shared prototype: setting `dog.speak = function() { return 'Woof specifically'; }` directly on `dog` shadows `Animal.prototype.speak` for that one instance only, every other `Animal` still uses the shared prototype version.

## Quick Test
- Rewrite `dog.speak()` using `call` to make a `cat` object "borrow" the method.
- What's the output of `console.log(Object.keys({a:1, get b(){return 2}}))`, does it include `b`?
- Difference between `Object.freeze` and `const`?
- What three things does `apply` need that `call` doesn't require in array form?
- Explain in one sentence why `class` isn't "real" classical inheritance.
- What does `[[Prototype]]` actually point to?
- Give one real use for `Object.create(null)`.
- Write a getter that computes a full name from first/last properties.
- Why does `Object.assign({}, obj)` not protect nested objects from mutation?
- What happens if two objects on the same prototype chain both define the same method name?
- What's the difference between `Object.keys()` and `for...in` when a prototype chain is involved?
- Why is `obj1 === obj2` almost always `false` for two separately-built objects with identical contents?
- What does `Object.create(proto)` skip that `new Ctor()` does not?
- How do you safely check for an own property without risking a missing `hasOwnProperty` method?
- Give a real example of intentionally shadowing a prototype method on a single instance.
</script>

<script type="text/markdown" data-group="JavaScript" data-id="js-4" data-title="Classes, Arrays &amp; Coercion">
## Core Concepts
`class` syntax provides constructors (the `constructor()` method, run automatically by `new`), instance methods (added to the class's `prototype` automatically, shared across all instances), static methods (attached to the class function itself, called as `ClassName.method()`, meant for functionality tied to the concept rather than any one instance), private fields (`#field`, genuinely inaccessible from outside the class, enforced by the engine, not just convention), and `extends`/`super` for inheritance (`super()` calls the parent constructor, `super.method()` calls a parent's version of an overridden method). **Encapsulation** means hiding internal state so outside code can only interact through a defined interface (achieved via `#private` fields or closures). **Polymorphism** means different subclasses can respond differently to the same method call, because each overrides it with its own implementation. **Composition over inheritance** is a design preference: instead of building a deep class hierarchy (`FlyingDog extends Dog extends Animal`), you give an object the specific behaviors it needs as separate, combinable pieces, avoiding the fragility of deep, rigid hierarchies where a change high up ripples unpredictably downward.

**Array methods** are the single highest-frequency practical coding topic in frontend interviews:
- `.map(fn)` transforms every element and returns a **new array of the same length**.
- `.filter(fn)` keeps only elements where `fn` returns truthy, returning a new (possibly shorter) array.
- `.find(fn)` returns the **first matching element itself** (not wrapped in an array), or `undefined` if none match.
- `.some(fn)` / `.every(fn)` return booleans: "does at least one match" / "do all match".
- `.reduce(fn, initial)` folds the whole array down into a single accumulated value, this is the one people freeze on in interviews because it's genuinely more abstract than the others, practicing `map` and `filter` reimplemented in terms of `reduce` builds real intuition for it.
- `.forEach(fn)` runs a callback for each element but returns `undefined` and cannot be stopped early with `break` (you'd need a plain `for` loop or `.some()`/`.every()` abused for early exit), a classic "spot the difference" interview trap against `map`.

```js
// map/filter/reduce implemented via reduce — a favorite live-coding exercise
const double = arr => arr.reduce((acc, x) => [...acc, x * 2], []);
const evens  = arr => arr.reduce((acc, x) => x % 2 === 0 ? [...acc, x] : acc, []);
const sum    = arr => arr.reduce((acc, x) => acc + x, 0);
const groupBy = (arr, keyFn) => arr.reduce((acc, item) => {
  const key = keyFn(item);
  (acc[key] ||= []).push(item);
  return acc;
}, {});
```

**Coercion** is JavaScript's automatic type conversion, and it's a rich source of interview trick questions precisely because the rules aren't symmetric across operators. With `+`, if *either* operand is a string, both sides are converted to strings and concatenated. With `-`, `*`, `/`, `%`, both sides are always converted to numbers, there's no "string concatenation" fallback for those operators. `==` performs coercion before comparing (`'5' == 5` is `true`); `===` never coerces, comparing both type and value, and should be the default choice unless you have a specific, deliberate reason to allow coercion. `NaN` is famously not equal to itself (`NaN !== NaN`), always test for it with `Number.isNaN(x)`, never `x === NaN`. Falsy values are exactly: `false, 0, -0, 0n, '', null, undefined, NaN`, everything else, including `'0'`, `[]`, and `{}`, is truthy. Optional chaining `?.` and nullish coalescing `??` were added specifically to fix a long-standing coercion pain point: `??` only falls back on `null`/`undefined`, unlike `||`, which also (often unintentionally) falls back on `0`, `''`, and `false`.

## Common Mistakes
- Using `.sort()` without a comparator on numbers, it silently sorts by converting elements to strings and comparing lexicographically, so `[10, 2, 1].sort()` gives `[1, 10, 2]`, not `[1, 2, 10]`.
- Mutating the array or its elements inside a `.map()` callback instead of returning a new transformed value, defeats the purpose of `map` and can introduce hard-to-trace bugs elsewhere that also hold a reference to that array.
- Chaining `.reduce()` with no initial value on an array that might be empty, throws a `TypeError` at runtime instead of failing gracefully.
- Reaching for `.forEach()` when you actually need the transformed data back, forcing an awkward pattern of pushing into an external array instead of just using `.map()`.
- Using `==` out of habit and accidentally allowing coercion you didn't intend, especially comparing against `0`, `''`, or `null`/`undefined` where the coercion rules are genuinely surprising.
- Assuming private class fields (`#field`) behave like the old `_field` convention, `#field` is truly inaccessible and will throw a `SyntaxError` if you try to reference it from outside the class body, even via `obj['#field']`.

## Interview Questions
1. *Why prefer `??` over `||` for defaults?* `||` treats every falsy value (`0`, `''`, `false`, `NaN`, `null`, `undefined`) as "not provided" and substitutes the fallback. `??` only substitutes when the left side is specifically `null` or `undefined`, which correctly preserves a legitimately-set value like `0` or `''` that `||` would otherwise incorrectly overwrite.
2. *Implement `.reduce()` from scratch.* `function myReduce(arr, fn, initial) { let acc = initial; let start = 0; if (acc === undefined) { acc = arr[0]; start = 1; } for (let i = start; i < arr.length; i++) acc = fn(acc, arr[i], i, arr); return acc; }` — writing this from memory tests whether you understand the accumulator pattern, not just how to call `.reduce()`.
3. *`.map()` vs. `.forEach()`, when would using the wrong one be a bug?* Using `.map()` when you don't actually need the returned array wastes memory allocating a throwaway array. Using `.forEach()` when you need transformed data back forces you to declare an external array and `.push()` into it manually, more verbose and easier to get wrong than just using `.map()` directly.
4. *What's composition over inheritance, with an example?* Instead of building `class FlyingDog extends Dog`, which only works if "flying" logically belongs to a `Dog` subclass, give any object that needs to fly a `flying` behavior object/mixin it can compose in. This avoids deep inheritance chains becoming fragile as requirements shift in ways that don't map cleanly to "is-a" relationships.
5. *Why is `0.1 + 0.2 !== 0.3`?* Because floating-point numbers are stored in binary, and 0.1 and 0.2 can't be represented exactly in binary any more than 1/3 can be represented exactly in decimal. The tiny representation error means the sum is actually `0.30000000000000004`. The fix is comparing within a small tolerance (`Math.abs(a - b) < Number.EPSILON`) rather than exact equality.
6. *What does a private class field enforce that `_name` convention doesn't?* True inaccessibility, enforced by the JavaScript engine itself. `_name` is still a perfectly normal, readable and writable property, the underscore is purely a human convention signaling "please don't touch this," easily ignored. `#name` cannot be accessed, read, or even detected from outside the class at all.
7. *When would you reach for a static method?* When the logic conceptually belongs to the class as a whole rather than to any specific instance, factory functions (`Account.createEmpty()`), validation utilities, or constants/configuration tied to the class.
8. *Predict: `[] + {}` vs. `{} + []`.* Both typically evaluate to the string `'[object Object]'` when used as expressions, since `+` coerces both operands to strings. But `{} + []` written as the very first thing in a statement can be parsed by JavaScript as an empty block statement followed by `+[]` (which evaluates to `0`), a classic Automatic Semicolon Insertion gotcha depending on context.
9. *Why does `[10,2,1].sort()` not sort numerically?* `Array.prototype.sort()`'s default comparator converts every element to a string and compares them character by character. `'10'` sorts before `'2'` lexicographically because `'1' < '2'`. You must always pass an explicit comparator, `(a,b) => a - b`, for correct numeric sorting.
10. *What's the risk of calling `.reduce()` with no initial value?* On an empty array, it throws a `TypeError` immediately since there's no first element to use as a starting accumulator. Even on a non-empty array, omitting the initial value means the first element itself becomes the initial accumulator and the callback starts from the second element, a subtle behavioral difference that can silently produce wrong results if your combining logic assumes a "zero" starting point.
11. *Explain the difference between `+=` and string concatenation in the context of coercion.* `+=` follows the exact same coercion rule as `+`: if either side is a string, the result is string concatenation; otherwise it's numeric addition. So `let x = 5; x += '5';` gives the string `'55'`, while `let x = 5; x += 5;` gives the number `10`.
12. *What's the output of `typeof NaN`?* `'number'`. `NaN` stands for "Not a Number," but ironically it's still classified as a numeric type value, it represents an invalid or unrepresentable numeric result, not the absence of a number type.
13. *Write a `flatten` function for an arbitrarily nested array without using `.flat()`.* A recursive `reduce`: `const flatten = arr => arr.reduce((acc, x) => acc.concat(Array.isArray(x) ? flatten(x) : x), []);`, tests recursion alongside array method fluency.
14. *Why might you use `Object.freeze` on a class instance's `#private` fields, even though they're already inaccessible from outside?* `#private` fields prevent outside *access*, but code inside the class can still reassign them. `Object.freeze` (or simply never exposing a setter) protects against accidental internal mutation bugs within the class's own methods, a separate concern from external encapsulation.
15. *When does `NaN` show up unexpectedly in real code?* Very commonly from `parseInt`/`Number()` on a non-numeric string, from `0/0`, from any arithmetic involving `undefined`, or from an array method like `.indexOf` returning `-1` and that `-1` later being used in a calculation that produces an invalid numeric result downstream.

## Quick Test
- What does `[1,[2,[3,4]]].flat(Infinity)` return?
- Write `sum` using `reduce` with no initial value, what breaks on an empty array?
- Static method vs instance method, give one real use for each.
- `'5' + 3` vs `'5' - 3`, output and why?
- What array method would you reach for to check "does at least one item match"?
- What does `#balance` protect against that `_balance` doesn't?
- Why does `sort()` need an explicit comparator for numbers?
- Give one example where composition beats inheritance.
- What's the output of `1 + '1' + 1`?
- Name one static method on a built-in object and what it does.
- Why does `x += '5'` behave differently from `x += 5`?
- What type does `typeof NaN` actually return, and why is that ironic?
- Implement `flatten` for a nested array recursively without `.flat()`.
- Why might `Object.freeze` still matter on a class's own private fields?
- Name one everyday situation where `NaN` shows up unexpectedly in a codebase.
</script>

<script type="text/markdown" data-group="JavaScript" data-id="js-5" data-title="Event Loop, Promises &amp; Async/Await">
## Core Concepts
Primitives (`string, number, boolean, null, undefined, symbol, bigint`) are stored and copied **by value**, assigning `let b = a` for a primitive `a` creates a completely independent copy. Objects (including arrays and functions) are stored **by reference**, assigning or passing an object around copies the reference (a pointer to the same underlying data), not the data itself, this is the actual mechanism behind so many "pass by reference" bugs where mutating a parameter inside a function unexpectedly affects the caller's original object.

**The event loop is the single highest-value JavaScript topic in interviews**, because it's the concept that ties together async behavior, and most candidates only have a fuzzy intuition for it rather than a precise model. JavaScript itself is single-threaded, one call stack, one thing executing at a time. Asynchronous work (timers, network requests, file I/O in Node) is handed off to the browser or Node runtime, not the JS engine, and when that work finishes, its callback doesn't run immediately, it gets placed into a queue to be picked up once the call stack is empty. There are two relevant queues: the **macrotask queue** (`setTimeout`, `setInterval`, I/O callbacks, UI rendering) and the **microtask queue** (`Promise.then/catch/finally`, `queueMicrotask`, `MutationObserver`). The event loop's rule is strict: after every single task, **the entire microtask queue is fully drained** before the next macrotask is even considered, and this happens between every single macrotask, not just once at the very end.

```js
console.log('A');
setTimeout(() => console.log('B'), 0);
Promise.resolve().then(() => console.log('C'));
console.log('D');
// Output: A, D, C, B
// — synchronous code runs first (A, D), then ALL pending microtasks (C),
//   only THEN does the next macrotask run (B), even with a 0ms delay
```

**Promises** model a value that will be available *eventually*, and they have exactly three states: **pending**, **fulfilled**, or **rejected**. Once a promise settles (fulfills or rejects), it can never change state again, this immutability is what makes promise chains predictable. `.then()` always returns a **brand new promise**, which is what enables chaining, and if any `.then()` in a chain throws (or returns a rejected promise), control skips directly to the nearest `.catch()` further down the chain, bypassing any intermediate `.then()` handlers.

`async`/`await` is syntactic sugar built entirely on top of promises: an `async function` always returns a promise, and `await` pauses execution of *that function* (not the entire program, not the whole thread) until the awaited promise settles, then either returns the resolved value or throws the rejection as a catchable exception. This is why ordinary `try/catch` works for `await`ed calls, something that was much clunkier with raw `.then()/.catch()` chains.

The four Promise combinators each serve a distinct purpose worth knowing precisely: `Promise.all([...])` resolves when *every* promise resolves (with an array of results in order), and rejects immediately if *any* one rejects, ideal for "I need all of these, and if any fails, the whole operation should fail." `Promise.allSettled([...])` never short-circuits, it always waits for every promise and gives you a `{status, value|reason}` object per result, ideal for "run all of these independently and tell me how each one went." `Promise.race([...])` settles as soon as the *first* promise settles, whether fulfilled or rejected, useful for timeouts (race a real request against a `setTimeout` that rejects). `Promise.any([...])` settles as soon as the first promise *fulfills*, ignoring rejections unless every single one rejects.

```js
async function getUser(id) {
  try {
    const res = await fetch(`/api/users/${id}`);
    if (!res.ok) throw new Error('Request failed');
    return await res.json();
  } catch (err) {
    console.error('Failed to fetch user:', err.message);
    return null;
  }
}

// Sequential (slower — total time = sum of both):
const a = await fetchA();
const b = await fetchB();

// Concurrent (faster — total time = the slower of the two):
const [a2, b2] = await Promise.all([fetchA(), fetchB()]);

// Timeout race pattern:
const withTimeout = (promise, ms) => Promise.race([
  promise,
  new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
]);
```

A key architectural point Node interviewers specifically probe: `process.nextTick` (Node-specific) has **even higher priority than promise microtasks**, it drains completely before the promise microtask queue does, on every single tick of the loop, this can cause `process.nextTick` callbacks to starve promise resolution if used recursively without care.

## Common Mistakes
- Forgetting `await` on a promise-returning call inside an `async` function, you get a pending `Promise` object where you expected the actual resolved value, and subsequent code silently operates on the wrong thing.
- Using `.forEach()` with an `async` callback and expecting it to wait for each iteration, `.forEach()` has no idea its callback is asynchronous, it fires all the callbacks immediately without waiting for any of them, use a `for...of` loop with `await` inside, or `Promise.all` with `.map()` for concurrent execution.
- Leaving a rejected promise completely unhandled (no `.catch()`, no surrounding `try/catch`), causing an "unhandled promise rejection" warning, and in some Node versions or configurations, a full process crash.
- Reaching for `Promise.all` when one failing request shouldn't invalidate the others, `Promise.allSettled` is almost always the right choice when you want partial success rather than all-or-nothing.
- Mutating an object passed as a function argument and assuming the caller's original is untouched, since objects are passed by reference, that mutation is visible to the caller too, unless you explicitly clone first.
- Chaining many sequential `await` calls that don't actually depend on each other's results, needlessly serializing work that could run concurrently with `Promise.all`.

## Interview Questions
1. *Walk through the classic event-loop snippet's output, step by step.* `console.log('A')` runs synchronously first. `setTimeout` schedules its callback as a macrotask and returns immediately, moving on. `Promise.resolve().then(...)` schedules its callback as a microtask and also returns immediately. `console.log('D')` runs synchronously. Now the call stack is empty, so the engine drains the ENTIRE microtask queue, logging `C`. Only after the microtask queue is fully empty does it move to the next macrotask, logging `B`. Final order: `A, D, C, B`.
2. *Why is `Promise.all` almost always better than sequential `await`s for independent calls?* Sequential awaits force each request to wait for the previous one to fully complete before starting, making total time the *sum* of every individual duration. `Promise.all` starts every request essentially simultaneously, making total time roughly the duration of the *slowest single* request, a massive difference at scale.
3. *What happens to a promise chain if one `.then()` throws?* The thrown error causes that promise to reject, and control jumps immediately past any remaining `.then()` handlers in the chain to the nearest `.catch()` (or to the catch block of a surrounding `try/catch` if using `await`).
4. *`typeof null`, what does it return, and why is that considered a bug?* It returns `'object'`, which is misleading since `null` represents the deliberate absence of any object. This is a decades-old bug baked into the very first JavaScript implementation, kept forever because fixing it would break an enormous amount of existing code that (often unknowingly) depends on it.
5. *Difference between `Promise.allSettled` and `Promise.all`?* `Promise.all` fails fast, rejecting the instant any single input promise rejects, discarding information about the others. `Promise.allSettled` always waits for every promise regardless of outcome and gives you a full report of which succeeded and which failed, never itself rejecting.
6. *Why doesn't `setTimeout(fn, 0)` run its callback immediately?* Because a macrotask can only run once the call stack is completely empty AND the entire microtask queue has been drained, `setTimeout(fn, 0)` merely means "run as soon as possible after that point," not "run right now, interrupting everything else."
7. *How do you handle an error from an `await`ed call?* Wrap the `await` expression in an ordinary `try/catch` block. A rejected awaited promise causes `await` to throw synchronously at that exact line, exactly like a regular thrown exception would, which `catch` intercepts normally.
8. *What's the difference between `Promise.race` and `Promise.any`?* `Promise.race` settles the instant ANY input promise settles, regardless of whether it fulfilled or rejected, first one to finish wins either way. `Promise.any` specifically waits for the first **fulfillment**, ignoring rejections along the way, and only rejects itself if every single input promise rejects.
9. *Why is pass-by-reference for objects a common source of subtle bugs?* Because two different variables can both point at the exact same underlying object in memory. Mutating the object through one variable is instantly visible through the other, which can cause "spooky action at a distance" bugs when a function silently mutates an object its caller still holds a reference to and relies on being unchanged.
10. *What's the practical fix for a `.forEach()` that needs to `await` each iteration in sequence?* Replace `.forEach()` with a `for...of` loop, `for (const item of items) { await process(item); }` properly pauses on each `await` before moving to the next iteration, something `.forEach()` structurally cannot do.
11. *What priority does Node's `process.nextTick` have relative to promise microtasks?* Higher. `process.nextTick`'s queue is fully drained before the promise microtask queue is even checked, on every single iteration, which means recursively scheduling `process.nextTick` calls can theoretically starve promise resolution entirely.
12. *How would you implement a timeout wrapper around an arbitrary promise?* `Promise.race([originalPromise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))])`, whichever settles first, the real result or the timeout rejection, wins.
13. *Why can an `async` function's return value always be treated as a promise, even if you `return` a plain value?* Because `async function` declarations are specified to always wrap their return value in a promise automatically, `return 5;` inside an `async function` is equivalent to `return Promise.resolve(5);` from the caller's perspective.
14. *What's a real-world scenario where `Promise.any` is the right combinator, rather than `Promise.all` or `race`?* Querying several redundant mirror servers for the same resource and only caring about getting a successful response from whichever one answers first, individual server failures shouldn't matter as long as at least one succeeds.
15. *Why might deeply nested `.then()` chains ("callback hell" for promises) be a code smell even though promises technically solve callback hell?* Because manually nesting `.then()` calls instead of chaining them flatly reintroduces the same deep-indentation, hard-to-follow control flow that promises were meant to eliminate in the first place, `async/await` was introduced specifically to make sequential asynchronous code read like ordinary synchronous code.

## Quick Test
- Where do `setTimeout` callbacks queue vs `.then` callbacks?
- Rewrite two independent `await` calls to run in parallel.
- What are the three states of a promise, and can a promise revisit a state?
- `typeof undefined` vs `typeof NaN`, what do each return?
- If a `.catch` is missing entirely, what happens to a rejected promise?
- Why does `Promise.all` reject as soon as one input rejects, while `allSettled` never does?
- What does wrapping an `await` in `try/catch` actually catch?
- Give one reason `forEach` is the wrong tool for a sequence of `await`ed calls.
- Predict the order: sync log, a `setTimeout(fn,0)`, a resolved `.then`, another sync log.
- What's the practical difference between primitive and reference storage when passing a value into a function?
- What priority does `process.nextTick` have relative to promise microtasks in Node?
- Implement a `withTimeout(promise, ms)` helper using `Promise.race`.
- Why does an `async function`'s return value always behave like a promise to its caller?
- When would `Promise.any` be the right choice over `Promise.all`?
- Why can deeply nested `.then()` chains still be a code smell even though promises solve callback hell?
</script>

<script type="text/markdown" data-group="JavaScript" data-id="js-6" data-title="Generators, Memory &amp; Functional JS">
## Core Concepts
An **iterator** is any object exposing a `.next()` method that returns `{value, done}` each call. An **iterable** is any object implementing the well-known `Symbol.iterator` method, which is what makes `for...of`, the spread operator, and destructuring able to consume it, arrays, strings, `Map`s, and `Set`s are all iterable out of the box, but plain objects are not, unless you explicitly add a `Symbol.iterator` method yourself.

**Generators** (`function*`) are a built-in shortcut for writing your own iterators without manually tracking state. The `yield` keyword pauses execution at that exact point and hands a value out to whoever called `.next()`, resuming from precisely that point (with all local variables intact) the next time `.next()` is called. Critically, calling a generator function doesn't run any of its code immediately, it just returns a generator object, execution only proceeds step by step as `.next()` is invoked, this laziness is what makes generators genuinely useful for representing infinite or very large sequences safely.

```js
function* range(start, end) {
  for (let i = start; i <= end; i++) yield i;
}
for (const n of range(1, 3)) console.log(n); // 1, 2, 3, lazily, one at a time

function* naturals() { let n = 1; while (true) yield n++; }
const gen = naturals();
gen.next().value; // 1
gen.next().value; // 2 — infinite sequence, but completely safe since nothing forces full iteration
```

`yield` is bidirectional: a value passed into `.next(value)` becomes the result of the `yield` expression that was paused, letting a generator act as a two-way communication channel with its caller, this exact mechanism is what `async/await` was historically implemented on top of before it became a native language feature.

**Symbol** creates guaranteed-unique primitive values, mainly used to define object keys that can never collide with a string key another part of the codebase (or a library) might also want to use, `Symbol.iterator` itself is a well-known symbol used by the language for this exact purpose. **Map** offers real advantages over plain objects: keys of any type (not just strings/symbols), guaranteed insertion-order iteration, a genuine `.size` property, and no accidental collisions with inherited `Object.prototype` methods. **Set** stores only unique values with O(1) `.has()` membership checks, versus an array's O(n) `.includes()`. **WeakMap**/**WeakSet** hold their keys/values with **weak references**, meaning an entry can be garbage-collected the moment nothing else references that key, which deliberately makes them un-iterable and size-less (you can never observe when an entry vanishes, by design), ideal for attaching metadata to an object's lifecycle without risking a memory leak.

**Memory & Garbage Collection**: JavaScript's garbage collector works on the principle of **reachability**, anything reachable by following references starting from the "roots" (global variables, the current call stack, active closures) is considered alive and kept. Everything else is eventually reclaimed. Real-world leak sources worth knowing precisely: forgotten `setInterval`/`setTimeout` timers whose callbacks close over large objects, event listeners registered but never removed (`addEventListener` without a matching `removeEventListener`), and **detached DOM nodes**, elements removed from the visible page but still referenced somewhere in JavaScript (a variable, a closure, an array), which prevents the browser from reclaiming that memory even though the element is no longer visible or interactive.

**Functional JS patterns**: **currying** transforms a multi-argument function `f(a,b,c)` into a chain of single-argument functions `f(a)(b)(c)`, enabling partial application. **Debounce** delays invoking a function until a quiet period (no new calls) of N milliseconds has passed, resetting the timer on every new call, ideal for search-as-you-type. **Throttle** guarantees a function fires at most once every N milliseconds no matter how frequently it's triggered, ideal for scroll or resize handlers. **Memoize** caches a pure function's outputs keyed by its inputs, trading memory for avoided recomputation.

```js
function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}
function throttle(fn, limit) {
  let inThrottle = false;
  return (...args) => {
    if (!inThrottle) {
      fn(...args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
}
function memoize(fn) {
  const cache = new Map();
  return (...args) => {
    const key = JSON.stringify(args);
    if (cache.has(key)) return cache.get(key);
    const result = fn(...args);
    cache.set(key, result);
    return result;
  };
}
```

## Common Mistakes
- Iterating a generator with `for...of` when you actually need its final `return` value too, `for...of` (and spread) silently discard the `{done:true, value}` object returned on the last `.next()` call.
- Assuming a `WeakMap` can be iterated over or has a `.size` property, it deliberately supports neither, since an entry can vanish via garbage collection at any unpredictable moment, exposing size or iteration would be meaningless and unreliable.
- Debouncing a function that genuinely needs to fire at least once immediately (like a submit button that should respond instantly to the first click), plain trailing-edge debounce always waits for the quiet period, a leading-edge variant is needed for that case.
- Using `JSON.stringify(args)` as a memoization cache key when arguments include functions, `undefined` values, or circular references, all of which `JSON.stringify` handles poorly or not at all.
- Assuming plain object key iteration order is fully guaranteed and stable across all key types the way `Map` is, integer-like string keys are actually reordered to ascending numeric order by the spec, regardless of insertion order.
- Forgetting to `clearInterval`/`clearTimeout` when a component or module using it is torn down, a slow, easy-to-miss memory leak that only becomes visible under long-running use.

## Interview Questions
1. *Debounce vs throttle, give a real use-case for each.* Debounce fits search-box autocomplete, you want to wait until the user actually pauses typing before firing an expensive API call. Throttle fits infinite-scroll or window-resize handlers, you want the handler to run periodically at a steady, bounded rate rather than not at all until things go quiet, since scrolling rarely "stops" the way typing does.
2. *Why use a `WeakMap` instead of a `Map` for data tied to a DOM node's lifecycle?* Because a `WeakMap` entry doesn't prevent its key (the DOM node) from being garbage-collected once removed from the page and no longer referenced elsewhere. Using a regular `Map` would keep that DOM node (and everything it references) alive forever, purely because it's still a key in your cache.
3. *What makes something eligible for garbage collection, precisely?* Being unreachable from any of the "roots": no global variable references it, it's not on the active call stack, and no live closure still holds a reference to it, directly or transitively.
4. *Implement `memoize` for a function taking a single primitive argument.* A closure over a plain object or `Map` keyed directly by the primitive argument (no need for `JSON.stringify` when the argument is already a primitive, which avoids stringification edge cases entirely).
5. *Why can't plain objects be used with `for...of`?* They don't implement the well-known `Symbol.iterator` method that `for...of` requires, only objects that implement it (or that inherit it, like arrays and Maps) count as "iterable" in the spec's sense.
6. *What does a generator object actually return before you call `.next()` for the first time?* Nothing has executed yet at all. Calling the generator function only produces the generator object itself; the function body starts running (up to the first `yield`) only once `.next()` is actually called.
7. *Why is a generator good for representing an infinite sequence?* Because values are produced lazily, one at a time, purely on demand. Nothing forces the engine to compute or hold the entire (theoretically infinite) sequence in memory upfront, unlike building a literal array of infinite length, which is simply impossible.
8. *When would `Set` be a meaningfully better fit than an array?* Whenever you need fast, repeated membership checks and inherent uniqueness, `Set.has()` is O(1) on average, while `Array.prototype.includes()` is O(n), a difference that compounds quickly inside a loop checking membership many times.
9. *What's a leading-edge vs. trailing-edge debounce?* Leading-edge fires immediately on the very first call, then ignores subsequent calls until the quiet period has elapsed. Trailing-edge (the far more common default) waits out the quiet period first and only then fires once, using the arguments from the most recent call.
10. *Give a concrete example of a detached DOM node leak.* Removing an element from the page with `element.remove()` but still holding a reference to it in a JavaScript variable, array, or closure elsewhere in the code, the browser can't reclaim that node's memory (or the memory of anything it references) as long as that reference exists.
11. *What's the practical difference between currying and simple partial application?* Currying specifically transforms a function into a strict chain of single-argument functions (`f(a)(b)(c)`). Partial application is the more general idea of pre-filling *some* arguments (possibly more than one at a time) and getting back a function awaiting the rest, currying is one specific, rigid way of achieving partial application.
12. *Why is `JSON.stringify` a fragile choice for a generic memoization cache key?* It silently drops `undefined` values and functions from objects, can't represent circular references at all (it throws), and doesn't guarantee stable key ordering across different JS engines for object arguments, all of which can produce incorrect cache hits or misses.
13. *Why does integer-like key ordering in plain objects surprise people coming from other languages?* The spec mandates that string keys that look like non-negative integers (`'1'`, `'2'`, `'42'`) are iterated in ascending numeric order FIRST, before any other string keys in their original insertion order, this is different from `Map`, which always preserves true insertion order regardless of key type.
14. *How would you build a simple pub/sub event system using closures instead of an `EventEmitter`?* A factory function returning `{subscribe(fn), publish(data)}`, where `subscribe` pushes `fn` into an array kept alive by the closure, and `publish` iterates that array calling each subscriber, a minimal illustration of closures managing shared, private state.
15. *What's the tradeoff of memoizing a function with an unbounded cache versus using an LRU (least-recently-used) cache?* An unbounded cache never forgets anything, which is simplest but can grow indefinitely and leak memory for functions called with many distinct argument combinations over a long-running process. An LRU cache caps memory usage by evicting the least-recently-used entries once a size limit is hit, trading a small amount of recomputation for bounded memory.

## Quick Test
- What does `yield` actually do to the function's execution?
- Map vs object: name two concrete advantages of Map.
- Give one real cause of a memory leak involving event listeners.
- Implement `once(fn)`, allow only the first call to actually execute.
- What's the output shape of a generator's `.next()` call?
- What's the difference between a generator and a plain hand-written iterator?
- Why can't you check a `WeakMap`'s size?
- When would throttle be preferable to debounce?
- What determines whether something is eligible for garbage collection?
- Implement a basic `curry(fn)` for a two-argument function.
- Why is `JSON.stringify` a risky choice for a general-purpose memoization key?
- Why do integer-like string keys iterate differently from other keys in a plain object?
- Build a minimal pub/sub system with closures in a few lines.
- What's the tradeoff between an unbounded memoization cache and an LRU cache?
- Implement a leading-edge debounce variant.
</script>


<script type="text/markdown" data-group="Browser &amp; Web" data-id="web-1" data-title="Browser, DOM, Storage &amp; Networking">
## Core Concepts
A browser tab runs its own **renderer process**, containing the JavaScript engine (V8 in Chrome, SpiderMonkey in Firefox), the **DOM** (the page's structural tree) and the **CSSOM** (computed style tree). The full rendering pipeline runs in stages: the HTML parser and CSS parser build the DOM and CSSOM in parallel, they're combined into a **render tree** (visible nodes only, `display:none` elements are excluded entirely), the browser computes **layout** (the exact geometry, size and position, of every visible element), **paint** fills in actual pixels for each layer, and **composite** assembles those layers together, often on the GPU, into the final frame shown on screen. Changing something that affects geometry (`width`, `top`, adding/removing an element) forces a **reflow**, which cascades expensively through layout, paint, and composite. Changing only a purely visual property handled at the compositor level (`transform`, `opacity`) can skip layout and paint entirely, which is exactly why CSS animations built on `transform`/`opacity` are dramatically smoother than ones animating `width`/`top`.

A `<script>` tag with no `async`/`defer` attribute **blocks HTML parsing entirely** the moment the parser reaches it, the browser must download (if external) and fully execute that script before continuing to parse the rest of the page. This is why scripts were traditionally placed at the very end of `<body>`, and why the modern attributes exist: `defer` downloads the script in the background without blocking parsing, then executes it after parsing completes, in the exact order the `defer` scripts appear in the document. `async` also downloads without blocking parsing, but executes the moment it finishes downloading, whichever script finishes first runs first, with no guaranteed order relative to other `async` scripts.

**DOM events** propagate through the tree in two distinct phases on every dispatch: first **capturing**, from the document root down to the actual target element, then **bubbling**, from the target back up to the root. Most event listeners are registered for the bubbling phase by default (`addEventListener('click', fn)`), capturing-phase listeners require an explicit third argument (`addEventListener('click', fn, true)`). `event.stopPropagation()` halts this flow at the current point (stopping the event from reaching listeners on ancestor or descendant elements it hasn't reached yet); `event.preventDefault()` is a completely separate concern, it cancels the browser's own default behavior (a link navigating, a form submitting) without affecting propagation at all. **Event delegation** exploits bubbling deliberately: instead of attaching a listener to every individual list item, you attach one listener to their shared parent and inspect `event.target` inside it, this scales far better for large or dynamically-changing lists and means new children added later automatically work with no extra listener setup.

**Storage** options each have distinct tradeoffs. `localStorage` persists indefinitely (until explicitly cleared), holds roughly 5-10MB per origin, is fully synchronous (which can briefly block the main thread on large reads/writes), and is shared across every tab of the same origin. `sessionStorage` behaves identically but is scoped to a single tab and cleared the moment that tab closes (surviving only a page refresh, not a close). Cookies are automatically sent with every matching HTTP request to the server, which makes them the right tool for anything the server needs to see on each request (like a session identifier), but also means oversized cookies add real overhead to every single request. `HttpOnly` on a cookie makes it completely invisible to JavaScript (`document.cookie` won't show it), a critical XSS defense for sensitive tokens. `Secure` restricts a cookie to HTTPS connections only. `SameSite` (`Strict`, `Lax`, or `None`) controls whether a cookie is sent along with cross-site requests at all, the modern default (`Lax`) already blocks most CSRF vectors without any extra token needed. `IndexedDB` is the odd one out, fully asynchronous, capable of storing large structured data (including binary blobs), and the right choice once you outgrow the simplicity (and size limits) of `localStorage`.

**Networking fundamentals**: HTTP methods carry semantic meaning that a well-designed API should respect, `GET` (read-only, no body, safely cacheable and repeatable), `POST` (create a new resource, not idempotent, calling it twice can create two resources), `PUT` (replace a resource entirely, idempotent, calling it twice with the same body produces the same end state), `PATCH` (partially update a resource), `DELETE` (remove a resource). Status codes are grouped meaningfully: `2xx` success, `3xx` redirection, `4xx` a problem with the client's request (`400` malformed request, `401` not authenticated at all, `403` authenticated but forbidden from this action, `404` resource doesn't exist, `429` rate limited), `5xx` a problem on the server's side. **CORS** (Cross-Origin Resource Sharing) is a *browser-enforced* security boundary, not a server-side one, the server can, and usually does, still fully process a cross-origin request, the browser simply refuses to let JavaScript on the page **read the response** unless the server's `Access-Control-Allow-Origin` header explicitly permits that origin. A **preflight** `OPTIONS` request is automatically sent by the browser ahead of any "non-simple" request (custom headers, `Content-Type: application/json`, methods other than `GET`/`POST`/`HEAD` with simple form-encoded bodies), essentially the browser asking the server "would you allow this?" before actually sending the real request.

## Common Mistakes
- Assuming a CORS error in the browser console means the server rejected or never received the request, in reality the request very often completed successfully server-side, the browser is only blocking JavaScript from reading the response.
- Forgetting that `SameSite=None` **requires** the `Secure` attribute too, a cookie marked `SameSite=None` without `Secure` will simply be rejected by modern browsers outright.
- Placing render-blocking `<script>` tags in `<head>` with no `defer`/`async`, silently and significantly delaying first paint on every page load.
- Animating layout-affecting CSS properties (`width`, `top`, `margin`) for "simple" UI transitions instead of `transform`, causing janky, dropped-frame animations especially on lower-powered devices.
- Storing a large or growing amount of data in a cookie instead of `localStorage`/`IndexedDB`, silently bloating every single HTTP request to that origin, including ones that don't even need that data.
- Relying on `localStorage` for data that must survive across different browsers/devices for the same logical "session," it's strictly per-browser, per-origin storage, not tied to a user account server-side.

## Interview Questions
1. *Why does animating `width` perform worse than animating `transform: scale()`?* Changing `width` triggers a full layout recalculation on every single animation frame, cascading into paint and composite each time. `transform` (and `opacity`) can be handled entirely on the compositor thread using the GPU, skipping layout and paint completely, which is dramatically cheaper and smoother.
2. *What's event delegation and why use it?* Attaching a single listener to a shared ancestor element and using `event.target` to determine which specific child triggered it, rather than attaching individual listeners to every child. This scales better for large lists and automatically covers children added dynamically after the listener was first set up.
3. *When does a CORS preflight fire?* Before any "non-simple" cross-origin request, one using a method other than `GET`/`HEAD`/simple `POST`, or including custom headers, or sending a body content-type other than a few simple form-encoded types (like `application/json`). The browser sends an automatic `OPTIONS` request first to check permissions.
4. *`localStorage` vs. cookies, when would you pick each?* Cookies when the *server* needs to see the data on every request automatically (session tokens, especially `HttpOnly` ones for security). `localStorage` for client-only data the server never needs, avoiding the overhead of sending it with every single HTTP request unnecessarily.
5. *Why is `401` different from `403`?* `401 Unauthorized` actually means "not authenticated at all," the server doesn't know who you are. `403 Forbidden` means "we know exactly who you are, and you're specifically not allowed to do this," a genuinely confusing pair of names that trips up even experienced developers.
6. *What's the difference between `defer` and `async` script attributes?* `defer` waits for HTML parsing to fully finish, then executes scripts in their original document order. `async` executes the instant the script finishes downloading, with no guaranteed order relative to other async scripts, whichever downloads first runs first.
7. *Does a CORS error mean the server rejected the request?* Not necessarily, and often not at all. The server frequently processes the request completely and sends back a full response, the browser is the one blocking JavaScript from reading that response because the required CORS header wasn't present.
8. *Why does a JSON `POST` typically trigger a preflight while a simple form `GET` usually doesn't?* A JSON body requires `Content-Type: application/json`, which isn't one of the handful of "simple" content types the spec allows without a preflight check, custom headers behave the same way. A plain GET with default headers and no body qualifies as "simple" and skips the preflight.
9. *sessionStorage vs. a tab refresh vs. a tab close?* Data in `sessionStorage` survives a page refresh within that same tab, but is permanently cleared the instant that specific tab is closed, it's tab-scoped, not just origin-scoped.
10. *Why choose a Web Worker over doing heavy computation on the main thread?* JavaScript's main thread also handles rendering and user interaction, a long-running computation there freezes the UI entirely. A Web Worker runs on a genuinely separate thread, keeping the page responsive while it computes, and communicates the result back via message passing when done.
11. *What's the practical difference between `stopPropagation()` and `preventDefault()`?* `stopPropagation()` affects event *flow* through the DOM tree (stopping ancestor/descendant listeners from firing). `preventDefault()` affects the browser's own built-in *behavior* for that event type (like a link navigating or a checkbox toggling), entirely unrelated concerns that are frequently confused.
12. *Why must `SameSite=None` always be paired with `Secure`?* Modern browsers reject a `SameSite=None` cookie outright if it isn't also marked `Secure`, since `None` deliberately allows cross-site sending, which without `Secure` (HTTPS-only) would expose the cookie to interception over plain HTTP.
13. *Give a concrete example of when event delegation would break down or be the wrong choice.* When you need to stop an event from bubbling past a specific child for reasons unrelated to the delegated handler, delegation relies on the event actually reaching the ancestor, if an intermediate handler calls `stopPropagation()`, the delegated listener never fires at all.
14. *What's the real difference between `IndexedDB` and `localStorage` beyond just size limits?* `IndexedDB` is fully asynchronous (never blocks the main thread), supports structured data types including binary blobs, and supports indexes for efficient querying, `localStorage` is synchronous, string-only (everything must be serialized), and has no querying capability beyond direct key lookup.
15. *Why can changing one CSS property sometimes trigger layout for unrelated-looking elements too?* Layout is inherently a tree-wide computation, changing the size of one element can shift the position of its siblings and everything below it in the document flow, this cascading effect is exactly why layout-triggering changes are so much more expensive than compositor-only ones.

## Quick Test
- Name the three rendering pipeline stages in order.
- What request does the browser send before a cross-origin PUT with a JSON body?
- Which storage option is synchronous and roughly 5-10MB?
- What's the difference between `stopPropagation` and `preventDefault`?
- Give one technique to keep a long list of 10,000 rows from freezing the UI.
- What actually blocks HTML parsing, and how do `defer`/`async` change that?
- Why doesn't a CORS error necessarily mean the server failed?
- Name one header the server must send back to allow a cross-origin request through.
- sessionStorage vs localStorage, which survives a tab close?
- Give one real task better suited to a Web Worker than the main thread.
- Why must `SameSite=None` always be paired with `Secure`?
- What can break event delegation from working as expected?
- Name two real advantages `IndexedDB` has over `localStorage` beyond capacity.
- Why can a layout change cascade to affect elements that weren't directly modified?
- Why is `401` so often confused with `403`, and what's the actual distinction?
