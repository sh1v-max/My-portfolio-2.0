## Core Concepts
TypeScript layers static type-checking on top of JavaScript, entirely at **compile time**, every type annotation, interface, and generic is completely erased from the actual output, at runtime, TypeScript code is just plain JavaScript with zero trace of the type system left behind, which is precisely why TypeScript types alone can never validate data that genuinely arrives at runtime (an API response, user input), that requires a separate runtime validation layer. **Interfaces** and **type aliases** both describe the shape of an object, and largely overlap in capability, but interfaces are specifically **extendable and declaration-mergeable** (multiple `interface Foo {}` declarations with the same name in the same scope automatically merge into one combined interface, a feature type aliases don't have), making interfaces the conventional choice for public, potentially-extended object shapes, while type aliases are required for unions, tuples, and more exotic type-level constructs interfaces simply can't express.

**Unions** (`string | number`) express "this value is one of these possibilities"; **intersections** (`TypeA & TypeB`) express "this value satisfies all of these simultaneously." **Generics** (`function identity<T>(x: T): T`) let a function or type work correctly across many different concrete types while still preserving the *specific* type actually used at each individual call site, avoiding the alternative of typing everything as `any` and losing all type safety, or writing near-duplicate overloads for every type you want to support. **Enums** define a named, fixed set of related constant values.

**Advanced type-level tools** are where TypeScript genuinely rewards depth: `keyof T` produces a union of a type's own property names as string literal types. `typeof someValue`, used in **type position**, captures the inferred type of an existing runtime value, letting you derive a type from a value rather than writing it out separately by hand. `infer`, used exclusively inside a **conditional type**, extracts and names a sub-part of another type for reuse (this is how many of TypeScript's built-in utility types are actually implemented internally). **Conditional types** (`T extends U ? X : Y`) branch at the type level based on whether one type is assignable to another. **Mapped types** (`{[K in keyof T]: SomeTransformation<T[K]>}`) transform every property of an existing type the same way, this exact mechanism is precisely how built-in utility types like `Partial<T>` (`{[K in keyof T]?: T[K]}`, making every property optional), `Pick<T, K>`, `Omit<T, K>`, and `Record<K, V>` are actually implemented under the hood, they aren't special-cased magic, they're just mapped types shipped in TypeScript's standard library.

**Type guards** narrow a broader union type down to one specific, concrete member within a particular code branch, using `typeof` (for primitives), `instanceof` (for class instances), a plain property-existence check, or a custom **type predicate function** (`function isX(v: unknown): v is X { ... }`) for arbitrary, more complex narrowing logic. **Discriminated unions** are a specific, extremely useful pattern where every variant of a union shares one common, literal "tag" property with a distinct value per variant, letting a `switch` statement on that shared tag exhaustively and safely narrow to the correct specific variant in each branch, with TypeScript itself able to verify at compile time that every possible variant has actually been handled.

```ts
type Shape =
  | { kind: 'circle'; radius: number }
  | { kind: 'square'; side: number };

function area(shape: Shape): number {
  switch (shape.kind) { // discriminated union narrowing
    case 'circle': return Math.PI * shape.radius ** 2;
    case 'square': return shape.side ** 2;
  }
}

// Generics constrained with `extends` — restrict T to a known shape while staying generic
function getProp<T, K extends keyof T>(obj: T, key: K): T[K] {
  return obj[key]; // TypeScript can verify this is valid precisely because K extends keyof T
}
```

`unknown` is the type-safe alternative to `any` that experienced TypeScript developers reach for by default: it accepts absolutely any value assigned to it (exactly like `any`), but, unlike `any`, TypeScript **forces you to narrow or explicitly assert** its type before you're allowed to actually do anything meaningful with it, catching an entire category of runtime errors `any` would silently let straight through unchecked.

```ts
function process(value: unknown) {
  if (typeof value === 'string') { // narrowing required before you can use value as a string
    return value.toUpperCase();
  }
}
```

**TS with React**: type component props with an interface, type built-in DOM events using React's own provided event types (`React.ChangeEvent<HTMLInputElement>`, `React.MouseEvent<HTMLButtonElement>`), type API response shapes with a shared interface reused across the codebase, and write generic custom hooks (`function useFetch<T>(url: string): {data: T | null, loading: boolean}`) so every specific caller gets back the exact correctly-typed data shape rather than a generic, unhelpful `any`.

**TS with Node**: define explicit **DTOs** (Data Transfer Objects) describing precisely what a request or response payload should look like, and, critically, actually **validate** that shape at runtime with a library like **Zod**, since TypeScript's compile-time types are completely erased by runtime and offer literally zero protection against genuinely malformed or malicious data arriving over the network, `z.infer<typeof schema>` derives a static TypeScript type directly from a single Zod schema definition, guaranteeing your compile-time types and your runtime validation logic can never silently drift apart from each other, since they both originate from one single source of truth.

## Common Mistakes
- Reaching for `any` to make an annoying type error go away, rather than properly typing the value or genuinely narrowing it, `any` doesn't just skip checking that one value, it silently disables type-checking for absolutely everything downstream that value subsequently touches too.
- Hand-writing a TypeScript interface separately from a Zod (or similar) runtime validation schema describing the supposedly same shape, letting the two silently drift out of sync over time as one is updated and the other is forgotten, `z.infer` deriving the type directly from the schema eliminates this entire class of bug structurally.
- Using the non-null assertion operator (`value!`) reflexively to bypass a legitimate `null`/`undefined` type error, rather than actually handling that case, converting a compile-time-caught potential bug into a genuine runtime crash if the assumption turns out to be wrong in practice.
- Assuming an `interface` and a `type` alias are fully interchangeable in every situation, and reaching for whichever one out of habit, missing that only `type` can express unions, tuples, and mapped/conditional types, while only `interface` supports declaration merging.
- Over-constraining a generic function with `extends` far more narrowly than actually necessary, needlessly limiting what types can call that function without any real corresponding type-safety benefit.
- Treating `unknown` and `any` as functionally interchangeable "escape hatches," `unknown` still meaningfully forces narrowing before use, `any` doesn't enforce anything at all.

## Interview Questions
1. *Interface vs. type alias, precisely when do you actually need `type`?* Whenever you need to express a union, a tuple, a mapped type, or a conditional type, none of which an `interface` can represent at all, interfaces are limited to describing object/class shapes (plus extending other interfaces).
2. *Why can't TypeScript alone ever validate an API request body's shape at runtime?* Because every TypeScript type annotation is completely erased during compilation to plain JavaScript, at runtime there is no trace of the type system left at all to check anything against, actual runtime validation requires a separate library (like Zod) that performs real checks against the real, arrived data.
3. *What does a discriminated union give you over an equivalent plain union without a shared tag field?* It lets TypeScript exhaustively and safely narrow to the exact correct variant inside each `switch`/`if` branch, purely by checking the one shared literal tag property, without needing any manual type assertions or awkward property-existence checks scattered through the branching logic.
4. *Implement `Partial<T>` conceptually, as a mapped type, from first principles.* `type MyPartial<T> = {[K in keyof T]?: T[K]}`, walk every key `K` of `T` via `keyof T`, and make each resulting property optional with `?`, this is literally how TypeScript's actual built-in `Partial<T>` is implemented in its standard library type definitions.
5. *Why is a properly-typed generic function meaningfully better than one typed with `any` in every parameter and return position?* A generic preserves the caller's *actual, specific* input type all the way through to the function's return type, letting TypeScript catch a genuine type mismatch right at the call site, `any` silently accepts and returns anything, providing precisely zero compile-time protection against a caller passing the wrong shape of data entirely.
6. *What does constraining a generic parameter with `extends keyof T` specifically enforce?* It restricts that type parameter to only ever be one of `T`'s actual own property key names, letting TypeScript statically verify that an expression like `obj[key]` is genuinely valid and correctly infer its precise resulting type, rather than falling back to an unhelpfully broad `any` or `string` for the access.
7. *Why is `unknown` considered a meaningfully safer default than `any` for representing "a value whose type we don't yet know"?* Because `unknown` still actively forces a type check, narrowing, or explicit type assertion before TypeScript will let you perform almost any operation on it at all, `any` disables type-checking entirely and unconditionally for that value, propagating that lack of safety silently into everything it subsequently touches.
8. *How, precisely, do you derive a TypeScript static type directly from a Zod runtime validation schema?* `type MyType = z.infer<typeof mySchema>;`, this guarantees the compile-time type and the runtime validation logic can genuinely never drift apart from each other, since both are mechanically derived from the exact same single schema definition.
9. *What's the concrete, real-world risk of overusing the non-null assertion operator (`value!`)?* It tells TypeScript "trust me, this specific value is definitely not `null`/`undefined` here" without TypeScript performing, or you providing, any actual runtime verification of that claim, if that assumption turns out to be wrong in some real execution path, it becomes a genuine, uncaught runtime crash exactly where a proper type-level check would have caught the problem safely at compile time instead.
10. *Why might a team deliberately configure a lint rule specifically banning `any` outright across their codebase?* Because `any` doesn't just silently disable checking for the one specific value it's applied to, it propagates that complete lack of type safety through every subsequent expression that value touches or flows into, a single unchecked `any` can quietly undermine type safety across a surprisingly large surrounding area of otherwise well-typed code.
11. *Write the TypeScript type for "a value that's either a plain string or an array of strings."* `type StringOrStrings = string | string[];`, a straightforward union combining a primitive type and an array type.
12. *What does `keyof` return when applied to `{name: string, age: number}`, precisely?* The union of string literal types `'name' | 'age'`, representing every one of that type's own property key names as a type-level value, usable anywhere a type is expected (like constraining a generic parameter, as shown earlier).
13. *Explain, in your own words, why pairing Zod (or a similar runtime validator) with TypeScript is strictly better than relying on either one alone.* TypeScript alone gives you excellent compile-time confidence about your own code's internal correctness, but offers zero protection whatsoever against genuinely malformed data arriving from outside your program's control (an API response, user-submitted form data). Zod alone gives you real runtime safety, but without deriving static types from it, you'd either duplicate the shape definition by hand in TypeScript separately (risking drift) or lose compile-time type-checking entirely for that data. Combining them, deriving the TypeScript type directly from the Zod schema, gives you both guarantees simultaneously from one single source of truth.
14. *Name a genuinely useful built-in utility type beyond `Partial`/`Pick`/`Omit`, and explain what it does.* `Record<K, V>` constructs an object type with keys of type `K` and every value of type `V`, useful for typing a lookup/dictionary object where you know the shape of the values but the specific set of keys is either dynamic or drawn from a known finite union.
15. *Why might a `React.ChangeEvent<HTMLInputElement>` type annotation matter beyond simply "making TypeScript stop complaining"?* It precisely and correctly types `event.target` as an actual `HTMLInputElement`, giving you correct, checked autocomplete and type-safety for input-specific properties like `.value` and `.checked`, using a looser or generic event type instead would either lose that specific autocompletion entirely or, worse, incorrectly allow accessing properties that don't actually exist on that particular kind of DOM event target.

## Quick Test
- What happens to TypeScript's types at runtime?
- Write the type for "a string or an array of strings."
- What does `keyof` return for `{name: string, age: number}`?
- Why pair Zod with TypeScript instead of using one alone?
- Name one utility type and what it does.
- What does constraining a generic with `extends keyof T` actually enforce?
- Why is `unknown` considered safer than `any`?
- How do you derive a TypeScript type directly from a Zod schema?
- What's the risk of overusing the non-null assertion operator?
- Why might a team ban `any` via a lint rule?
- What can `type` express that `interface` fundamentally cannot?
- Implement `Partial<T>` from first principles as a mapped type.
- What does `React.ChangeEvent<HTMLInputElement>` give you beyond just silencing a type error?
- Name a built-in utility type beyond Partial/Pick/Omit and explain it.
- Why does over-constraining a generic unnecessarily hurt a function's usability?
</script>

<script type="text/markdown" data-group="System Design" data-id="sysdesign-1" data-title="HTTP, API Architecture &amp; Scaling">
## Core Concepts
**HTTP/1.1** opens a new TCP connection per request by default unless `keep-alive` explicitly reuses an existing one, and even with `keep-alive`, requests on one connection are processed strictly in order, a slow request head-of-line-blocks everything queued behind it on that same connection. **HTTP/2** solves this at the HTTP layer by multiplexing many requests and responses over a single, shared connection simultaneously, along with header compression, dramatically reducing connection overhead for pages loading many resources. **HTTP/3** goes further, replacing the underlying transport itself with QUIC, built on UDP rather than TCP, specifically to eliminate a remaining, more fundamental head-of-line-blocking problem that exists at the TCP transport layer itself, one that HTTP/2's application-layer multiplexing alone couldn't fully solve.

**API architecture styles** each fit different needs. **REST** is resource-oriented, simple to reason about, and naturally cacheable per-URL by intermediaries (browsers, CDNs). **GraphQL** lets the client specify exactly which fields it needs in a single request, directly solving REST's common over-fetching (getting fields you don't need) and under-fetching (needing several separate REST calls to assemble one view) problems, at the real cost of more complex server-side query resolution and, critically, much harder HTTP-level caching, since requests typically all hit one single endpoint via `POST` with a different query body each time, defeating URL-based caching entirely. **WebSockets** establish a genuinely persistent, full-duplex connection, ideal when the client also needs to push data back to the server over that same connection, not just receive updates (a chat application). **SSE** (Server-Sent Events) provides simpler, one-directional server-to-client streaming over a plain HTTP connection, the right, simpler choice whenever the client never actually needs to send data back over that same channel (live notifications, a live-updating dashboard).

**Caching** forms a layered stack, from closest to the user to furthest: the **browser's own cache** (governed by `Cache-Control` response headers), a **CDN** (serving static or cacheable content from edge locations physically near the user, reducing both latency and origin server load), and an **application-level cache** (typically Redis, sitting directly in front of the database for expensive or extremely frequently-read data). **Cache invalidation** is famously one of the two genuinely hard problems in computer science, common strategies include a **TTL** (Time To Live, simply expire cached data automatically after N seconds, simple to implement, but can briefly serve stale data until that expiry hits) and **cache-aside** (the application checks the cache first on a read; on a miss, it reads from the actual database and explicitly populates the cache for next time, giving the application direct control over invalidation timing).

**Core system design building blocks**: a **load balancer** distributes incoming traffic across multiple server instances, using a strategy like round-robin (cycle through servers evenly in sequence), least-connections (route to whichever server currently has the fewest active connections, adapting naturally to uneven request durations), or IP-hash (route based on a hash of the client's IP, giving simple session affinity without needing shared session storage, at the real risk of unevenly loading servers if many clients share one IP, like an office behind a single NAT). **Horizontal scaling** (adding more server machines) fundamentally requires the application to be **stateless**, meaning no server holds session data purely in its own local memory, since the load balancer can route any given client's next request to any different server instance at any time, session data must instead live in a shared store (Redis) or be encoded directly in the request itself (a JWT). **Vertical scaling** (making one existing machine bigger/more powerful) is architecturally simpler but eventually hits a hard physical and cost ceiling. A **reverse proxy** (Nginx, commonly) sits directly in front of application servers, handling TLS termination, load balancing, and request routing in one place. Clean backend layering (`Route → Controller → Service → Repository → Database`) keeps HTTP-specific concerns, actual business logic, and raw data access cleanly separated from each other, each layer independently testable and replaceable. At genuine scale, **message queues** (Kafka, RabbitMQ, conceptually) decouple the producer of some work from its eventual consumer entirely, letting a user-facing request return quickly while genuinely slow or non-essential background work (sending a confirmation email, generating a report) is processed asynchronously, separately, without making the user's own request wait on it.

A load balancer's chosen strategy has real, concrete consequences: round-robin assumes every request costs roughly the same to serve, which frequently isn't true in practice. Database **read replicas** offload read-heavy traffic away from the primary database instance, but replication between the primary and its replicas is typically **asynchronous**, meaning a read immediately following a write can, in principle, hit a replica that hasn't yet received and applied that specific write, a real phenomenon called **replication lag**, a genuine, common source of "I definitely just saved this, but it's not showing up yet" bugs in production systems.

## Common Mistakes
- Assuming a read immediately following a write will always reflect that write, if the read happens to land on a lagging replica, it can briefly return stale, pre-write data, a real consequence of asynchronous replication that application logic sometimes needs to explicitly account for.
- Choosing IP-hash load balancing without accounting for the real possibility that many distinct end users can share a single public IP address (behind a corporate NAT, for instance), which can unintentionally concentrate a disproportionate amount of traffic onto just one backend server.
- Introducing a message queue reflexively for every single operation, regardless of whether the user genuinely needs to wait synchronously for that specific result, adding real architectural complexity and operational overhead where a simple, direct synchronous call would have been entirely sufficient and simpler to reason about.
- Building a genuinely stateful application server (session data held purely in local server memory) and then attempting to scale it horizontally, requests for the same logical session can land on a different server that has no knowledge of that session at all, causing baffling, intermittent "randomly logged out" style bugs.
- Assuming GraphQL is a strictly superior default choice over REST in every situation, without accounting for its meaningfully harder HTTP-level caching story and its added server-side query-resolution complexity, which isn't worth the tradeoff for genuinely simple, well-defined API surfaces.
- Relying purely on a TTL-based cache invalidation strategy for data where briefly serving stale content is genuinely unacceptable (real-time financial balances, for instance), where a more actively-managed cache-aside or explicit invalidation strategy is actually required.

## Interview Questions
1. *Why does GraphQL trade away easy HTTP-level caching, specifically?* Because GraphQL requests conventionally all target one single endpoint via `POST`, with the actual query specified inside the request body rather than the URL itself, and URL-based caching mechanisms (browser caches, CDNs) key their caching decisions on the URL, a POST to one unchanging URL with a different body each time simply isn't cacheable by those mechanisms the way distinct REST endpoint URLs naturally are.
2. *WebSockets vs. SSE, precisely when would you choose each?* Choose WebSockets when the client genuinely needs to send data back to the server over that same persistent connection, not merely receive updates (a chat application, where the user also sends messages). Choose SSE when communication is purely one-directional, server-to-client, and the client never needs to push anything back over that same channel, a meaningfully simpler protocol for that narrower, common use case.
3. *Why must an application genuinely be stateless to scale horizontally?* Because a load balancer can, and does, route any given client's successive requests to different backend server instances over time, if session data lived only in one specific server's local memory, a request routed to a different instance would have no knowledge of that session at all, statelessness (session data in a shared store, or encoded directly in a token like a JWT) ensures any instance can correctly handle any request.
4. *TTL vs. cache-aside, what specific risk does each individually carry?* A TTL-based cache risks briefly serving genuinely stale data for however long remains until that TTL naturally expires. A cache-aside strategy risks a "cache stampede," many concurrent requests all missing the cache simultaneously (right after an expiration, or on a cold cache) and all hitting the underlying database at once, potentially overwhelming it.
5. *Why introduce a message queue instead of simply doing slow, non-essential work synchronously, inline, within the original request?* So the user's request can return a fast response immediately, rather than waiting on a slow, genuinely non-essential-to-the-immediate-response task (like sending a confirmation email) to fully complete before the user gets any response back at all, meaningfully improving perceived responsiveness and overall resilience if that background task happens to fail or is temporarily delayed.
6. *Name three load balancing strategies and what each is specifically optimized for.* Round-robin, simplicity and even distribution, assuming every request costs roughly the same to serve. Least-connections, adapts naturally to requests of genuinely uneven duration, sending new traffic to whichever server is currently least busy. IP-hash, provides simple session affinity (the same client consistently reaches the same server) without requiring any shared, centralized session storage.
7. *What is replication lag, precisely, and what real bug does it commonly cause?* The unavoidable delay between when a write is committed on a primary database and when that same write has actually propagated to and been applied on a given read replica. A read that happens to land on a replica during that lag window returns stale, pre-write data, commonly manifesting as "I just saved this, why isn't it showing up yet" bugs immediately after a write-then-read sequence.
8. *Why might IP-hash load balancing backfire specifically in an office or campus network setting?* Because many distinct individual users behind a single shared NAT'd public IP address would all be consistently routed, by design, to the exact same backend server, concentrating a disproportionate share of that specific location's total traffic onto one instance, defeating the fundamental purpose of load balancing for that entire group of users.
9. *Describe a concrete scenario where adding a message queue would genuinely be the wrong architectural call.* An operation where the user's own request fundamentally requires that specific result to proceed at all, validating a payment before confirming an order, for instance, deferring that check to an asynchronous queue would force awkward polling or a more complex callback-based flow purely to reintroduce the synchronous behavior the user's actual use case genuinely needs.
10. *Give one concrete, practical fix for a "just wrote it, reading stale data" bug caused by replication lag.* Read the just-written data back from the primary database itself (or from a designated strongly-consistent read path) immediately following a write, specifically for that write's own confirmation or follow-up display, reserving read replicas purely for reads that can genuinely tolerate a small amount of staleness.
11. *What problem does HTTP/2's multiplexing specifically solve that HTTP/1.1 with `keep-alive` alone couldn't?* Head-of-line blocking at the application (HTTP) layer, on HTTP/1.1, even with a reused connection, requests are still processed strictly in order on that connection, one slow request blocks everything queued behind it. HTTP/2 allows many requests and responses to be interleaved concurrently over that same single connection, so one slow response no longer blocks the others.
12. *Why does HTTP/3 exist at all, if HTTP/2 already solved application-layer head-of-line blocking?* Because a deeper head-of-line-blocking problem still remained at the underlying TCP transport layer itself, a single lost or delayed TCP packet still blocks delivery of every subsequently-received packet on that same connection, regardless of HTTP/2's own application-layer multiplexing. HTTP/3's QUIC transport, built on UDP, solves this more fundamental transport-layer issue directly.
13. *What's the role of a reverse proxy specifically, distinct from a load balancer, even though the same piece of software (like Nginx) often performs both roles simultaneously?* A reverse proxy's core role is receiving incoming client requests on behalf of backend servers and forwarding them appropriately, commonly also handling TLS termination (decrypting HTTPS once at the proxy rather than on every individual backend instance) and request routing based on path or host, load balancing (distributing across multiple backend instances) is one common additional responsibility layered on top, but conceptually a distinct concern.
14. *Why does clean backend layering (Route → Controller → Service → Repository → Database) genuinely matter beyond just code organization aesthetics?* It keeps each individual layer independently and easily testable in isolation (mocking a repository to test service logic without needing a real database, for instance), and it lets you swap out an underlying implementation detail, changing databases, or the specific web framework, with meaningfully less disruption to layers above it that were never coupled to that specific implementation detail in the first place.
15. *Give a genuinely realistic scenario where you'd deliberately choose Server-Sent Events over polling for "real-time-ish" updates.* A live dashboard showing continuously updating metrics or notifications, where polling would mean the client repeatedly re-requesting "anything new?" on a fixed interval regardless of whether anything has actually changed, wasting requests during quiet periods and potentially feeling laggy during bursty periods, SSE instead keeps one open connection and the server pushes an update the moment there genuinely is one, more efficient and more immediately responsive than polling, while remaining meaningfully simpler to implement than a full WebSocket connection for this specific one-directional use case.

## Quick Test
- What problem does HTTP/2 multiplexing solve?
- Name the four cache layers from browser to database, in order.
- What does "stateless" mean for horizontal scaling?
- Give one advantage GraphQL has over REST, and one it gives up.
- What's the role of a reverse proxy in front of your app?
- Name two load balancing strategies and what each is good for.
- What is replication lag, and what bug does it commonly cause?
- Why can IP-hash load balancing backfire behind a shared NAT?
- When would adding a message queue be the wrong call?
- What's one fix for a stale-read bug caused by replication lag?
- Why does HTTP/3 exist if HTTP/2 already solved application-layer head-of-line blocking?
- What's the distinct role of a reverse proxy versus a load balancer, even when combined in one tool?
- Why does clean backend layering matter beyond code organization?
- Give a realistic scenario favoring SSE over plain polling.
- Why is cache invalidation considered one of the genuinely hard problems in computer science?

<script type="text/markdown" data-group="DSA" data-id="dsa-1" data-title="Interview Patterns &amp; Mock Interview Framework">
## Core Concepts
The efficient way to revise DSA for interviews is by **pattern**, not by memorizing individual problems, recognizing which underlying pattern a new, unseen problem maps to is the actual transferable skill interviewers are testing for.

**Arrays**: frequency maps (a plain object or `Map` counting occurrences) solve the large family of anagram, duplicate-detection, and "most/least frequent element" problems in a single O(n) pass. Prefix sums (`prefix[i] = prefix[i-1] + arr[i]`) let you answer any range-sum query in O(1) after a one-time O(n) precomputation, essential whenever a problem involves many repeated range queries over the same static array. Kadane's algorithm finds the maximum-sum contiguous subarray in a single O(n) pass by tracking, at each position, either "extend the previous subarray" or "start fresh from here," whichever currently yields a larger sum.

**Strings**: character-frequency comparison (build a frequency map of each string and compare them) is the standard efficient technique for anagram detection, letters in a different order but genuinely present in matching counts. Two-pointer palindrome checks compare characters from both ends of the string moving inward simultaneously, stopping the moment they find any mismatch.

**Two pointers**: place one pointer at each end of a sorted array or string (or occasionally, two pointers moving at different relative speeds through the same structure) and move them inward based on a comparison, the canonical example being finding a pair of numbers summing to a specific target in a sorted array in O(n) instead of the naive O(n²) checking every pair.

**Sliding window**: maintain a window (defined by a start and end index) over an array or string, expanding it by moving the end pointer forward and shrinking it by moving the start pointer forward whenever a defined condition is violated, this transforms "longest/shortest substring or subarray satisfying some condition" problems from a naive O(n²) (checking every possible substring) down to a single O(n) pass.

```js
// Sliding window: longest substring without repeating characters
function lengthOfLongestSubstring(s) {
  const seen = new Map();
  let start = 0, max = 0;
  for (let end = 0; end < s.length; end++) {
    if (seen.has(s[end]) && seen.get(s[end]) >= start) {
      start = seen.get(s[end]) + 1; // shrink the window past the previous occurrence
    }
    seen.set(s[end], end);
    max = Math.max(max, end - start + 1);
  }
  return max;
}
```

**Binary search**: the classic use is finding a target value in a sorted array in O(log n) by repeatedly halving the search space, but the more advanced, frequently-tested application is **binary searching an answer space** rather than an array directly, whenever a problem has a monotonic property (something is true for all values below some threshold and false above it, or vice versa), binary search can find that threshold directly, even when there's no literal sorted array in sight at all.

**Stacks & queues**: a stack (LIFO) is the natural fit for matching-bracket/parentheses validation problems, and for "next greater element"-style problems, where you push indices and pop them once you find an element satisfying the condition relative to the top of the stack. A queue (FIFO), and its double-ended cousin the deque, underlies breadth-first search (BFS) and sliding-window-maximum-style problems, where you need to efficiently access or remove from both ends.

**Linked lists**: the fast/slow pointer technique (Floyd's cycle detection, "the tortoise and the hare") advances one pointer one step at a time and another two steps at a time, if there's a cycle, the fast pointer will eventually lap the slow one and they'll meet, if there's no cycle, the fast pointer simply reaches the end first, this same two-speed-pointer technique also finds a linked list's middle node in a single pass. Reversing a linked list in place, re-pointing each node's `next` to its predecessor as you walk the list, is a near-universal warm-up question specifically because it tests careful, correct pointer manipulation under a small amount of genuine pressure.

**Trees**: depth-first traversal (pre-order: visit node, then left, then right; in-order: left, node, right, notably produces sorted output for a binary search tree; post-order: left, right, node) is usually implemented recursively, but can always be rewritten iteratively using an explicit stack, know both forms, since interviewers sometimes specifically ask for the iterative version. Breadth-first traversal (level-order) uses an explicit queue instead, processing the tree level by level.

**Graphs**: DFS and BFS traversal are the two fundamental building blocks nearly everything else builds on. An adjacency list (each node stores a list of its direct neighbors) is generally preferred over an adjacency matrix (an n×n grid of connectivity) for **sparse** graphs (relatively few edges compared to the maximum possible), since it uses meaningfully less memory and lets you iterate a node's actual neighbors directly, without needing to scan an entire row checking every other node. Topological sort (a linear ordering of nodes respecting all directed edge dependencies) solves dependency-ordering problems (build systems, course-prerequisite scheduling) directly, and only exists at all for a graph with no cycles.

**Recursion & backtracking**: always define the base case (the condition that stops the recursion) explicitly and first, before writing the recursive case that breaks the problem down further. Backtracking specifically means: try a candidate choice, recurse deeper as if that choice were final, and if that path doesn't lead anywhere valid, explicitly **undo** that choice and try the next available alternative, this exact "try, recurse, undo" structure is the backbone of permutation, combination, and constraint-satisfaction-style problems (like N-Queens).

## Common Mistakes
- Jumping straight into writing the fully-optimal solution's code without first stating the brute-force approach out loud, leaving the interviewer with no visible insight into your actual reasoning process if you happen to get stuck partway through the optimal approach.
- Forgetting to explicitly state your solution's time and space complexity unprompted once you've finished, interviewers routinely deduct real credit for a correct answer delivered with zero complexity analysis attached to it.
- Not testing your own finished solution against genuinely important edge cases (an empty input, a single-element input, an input entirely made of duplicates) before confidently declaring it complete.
- Reaching immediately for a brute-force nested loop out of habit on a problem that clearly signals a sliding-window or two-pointer pattern instead, wasting valuable interview time before eventually arriving at the actually-expected, more efficient approach.
- Attempting recursion without first explicitly, clearly stating the base case, a frequent, direct cause of either an infinite recursive loop or an off-by-one error at the recursion's actual boundary condition.
- Confusing an adjacency list with an adjacency matrix's respective time/space tradeoffs, and consequently choosing the wrong representation for a given graph's actual density, hurting either memory usage or traversal efficiency unnecessarily.

## Interview Questions
1. *Why is narrating your thought process out loud specifically considered part of what's being formally evaluated, not just a "nice to have"?* Because interviewers are fundamentally assessing your problem-solving *process*, how you approach an unfamiliar problem, not merely whether you happen to produce correct final output, silent coding gives them genuinely nothing to evaluate or productively guide if you happen to get stuck partway through.
2. *When specifically do prefix sums outperform simply recalculating each range sum directly from the raw array?* Whenever a problem involves querying many different ranges over the exact same, unchanging underlying array, prefix sums answer each individual subsequent query in O(1) time after one initial O(n) precomputation pass, versus O(n) recalculated fully from scratch for every single query if you don't precompute anything.
3. *Why does the sliding-window pattern outperform a brute-force nested-loop approach for substring/subarray problems, precisely?* Because a naive brute-force approach re-examines heavily overlapping portions of the string or array repeatedly across different starting positions, a sliding window instead incrementally expands and shrinks a single window across one full O(n) pass, never redundantly re-examining the same elements from scratch.
4. *What's the precise, core structural difference between backtracking and plain, ordinary recursion?* Backtracking specifically, explicitly undoes a tentative choice and tries the next available alternative the moment a given path is determined not to lead anywhere valid, plain recursion generally just breaks a problem down into smaller, independent sub-problems without that specific "try a choice, recurse, then explicitly undo it if it fails" search-and-backtrack structure.
5. *DFS vs. BFS for finding the shortest path in an unweighted graph, which do you use, and precisely why?* BFS, because it explores the graph level by level, outward from the starting node, guaranteeing that the very first time it reaches any given target node is necessarily via the shortest possible path (measured in number of edges), DFS provides no such guarantee at all, it might stumble onto a needlessly long path to the target well before ever finding a genuinely shorter one.
6. *Why specifically narrate the brute-force approach out loud before diving into coding the fully-optimal solution?* It concretely demonstrates genuine first-principles problem-solving reasoning rather than simply having memorized the "expected" optimal answer, and it gives the interviewer a clear, useful fallback checkpoint to fall back on and discuss together if the more optimal approach ends up stalling or going sideways partway through.
7. *What's the precise time and space complexity of a typical single-pass hash-map-based solution (like the classic "two sum" problem)?* O(n) time (one single pass through the input, with O(1) average-case hash-map lookups and insertions at each step) and O(n) space (in the worst case, storing every single element in the hash map before finding the actual answer).
8. *Why does explicitly stating your solution's complexity matter, even when the solution itself is already fully correct?* Because interviewers are specifically evaluating whether you genuinely understand your own solution's real-world tradeoffs, not merely whether it happens to produce the correct output for the given test cases, a candidate who can't articulate their own solution's complexity raises a real, specific red flag about the depth of their actual understanding.
9. *Name three specific, concrete edge cases genuinely worth checking before confidently declaring any solution complete.* An empty input (does the solution handle a length-zero array/string gracefully, without throwing?), a single-element input (does an assumption baked into a two-pointer or sliding-window approach silently break down at that boundary?), and an input consisting entirely of duplicate values (does a solution relying on distinctness silently produce a subtly wrong result?).
10. *Why might an interviewer specifically ask you to solve the exact same problem a second time, but with less memory usage than your first solution?* To directly and specifically test whether you genuinely understand the real time-space tradeoff underlying your first solution, rather than having simply produced one single working answer by rote pattern-matching, a strong candidate can usually articulate at least one concrete way to trade some additional time complexity for meaningfully reduced space, or vice versa.
11. *Why is an adjacency list generally preferred over an adjacency matrix for a genuinely sparse graph, specifically?* An adjacency matrix always requires O(V²) space regardless of how many edges the graph actually has, wasteful when a graph has relatively few edges compared to that theoretical maximum. An adjacency list uses space proportional to the graph's actual number of edges, O(V + E), and directly provides a node's real list of neighbors without needing to scan an entire row checking every other node for a connection that likely doesn't exist.
12. *What's the essential, correctly-stated "base case discipline" for writing any correct recursive solution?* Explicitly identify and write the base case, the specific, simplest condition under which the function returns a value directly without making any further recursive call, *before* writing the recursive case, and rigorously verify that every recursive call genuinely, provably makes measurable progress toward eventually satisfying that base case, otherwise you risk either infinite recursion or a subtle off-by-one error precisely at the recursion's actual boundary.
13. *Walk through Floyd's cycle-detection algorithm and explain, precisely, why it's guaranteed to correctly detect a cycle if one exists.* Two pointers traverse the linked list simultaneously, one advancing one node per step (the "slow" pointer), the other advancing two nodes per step (the "fast" pointer). If the list genuinely contains a cycle, the faster pointer will eventually re-enter that cycle and, because it's closing the relative distance to the slower pointer by exactly one node per step once both are inside the same cycle, it's mathematically guaranteed to eventually "lap" and meet the slower pointer again. If there's no cycle at all, the fast pointer simply reaches the list's actual end first, with no meeting ever occurring.
14. *Why does topological sort only exist for, and only make sense for, a directed graph with absolutely no cycles?* Because a topological ordering fundamentally requires every single directed edge to point strictly "forward" in the final resulting order (if A must come before B, A appears earlier in the ordering), a cycle would require some node to simultaneously come both before and after another connected node in that same ordering, a direct logical contradiction, which is precisely why a genuine cycle in the underlying dependency graph makes finding any valid topological order fundamentally impossible.
15. *Give one concrete, realistic technique for actively self-running effective mock interview practice sessions, on your own, without a second person available to interview you.* Pick one JavaScript question, one React question, and one algorithmic/DSA question entirely at random from your own accumulated notes, answer each one fully out loud for up to roughly three minutes (not silently in your head), then deliberately push yourself with at least one genuine, specific follow-up question that goes meaningfully past your own initial, surface-level answer, before finally identifying your single weakest topic from that particular session and explicitly re-reading and reinforcing that exact topic before your very next practice session.

- Why might an interviewer ask for a second, more space-efficient solution?
- Why does topological sort only exist for graphs with no cycles?
- Walk through why Floyd's cycle detection is mathematically guaranteed to work.
- Why is an adjacency list more space-efficient than a matrix for a sparse graph?
- DFS vs BFS for shortest path in an unweighted graph, and why?
- Describe a concrete way to run an effective solo mock interview session.

<div class="app">
  <aside class="sidebar" id="sidebar">
    <p class="brand">interview-prep<small>JS · React · Node · SQL · TS · System Design · DSA</small></p>

    <div class="progress-wrap">
      <div class="progress-label"><span id="progress-text">0 / 20 done</span><span id="progress-pct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search" type="text" placeholder="Search topics or content…" autocomplete="off">
    </div>

    <button class="theme-btn" id="theme-toggle">toggle theme</button>

    <nav id="nav-groups"></nav>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <button class="sidebar-toggle" id="sidebar-toggle">☰ Topics</button>
    <div class="main-inner" id="main-inner">
      <p class="crumb" id="crumb"></p>
      <h1 class="topic-title" id="topic-title"></h1>
      <div id="content"></div>
      <div class="topic-nav">
        <button class="nav-btn prev" id="btn-prev"><span class="dir">← previous</span><span id="prev-label"></span></button>
        <button class="nav-btn next" id="btn-next"><span class="dir">next →</span><span id="next-label"></span></button>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- gather topics from the data scripts ---------- */
  const scripts = Array.from(document.querySelectorAll('#data script[type="text/markdown"]'));
  const TOPICS = scripts.map(s => ({
    id: s.dataset.id,
    group: s.dataset.group,
    title: s.dataset.title,
    raw: s.textContent.trim()
  }));
  const GROUP_ORDER = [];
  TOPICS.forEach(t => { if (!GROUP_ORDER.includes(t.group)) GROUP_ORDER.push(t.group); });

  /* ---------- tiny markdown renderer ---------- */
  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inline(str){
    str = escapeHtml(str);
    str = str.replace(/`([^`]+)`/g, '<code>$1</code>');
    str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    str = str.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return str;
  }
  function renderMarkdown(md){
    const lines = md.split('\n');
    let html = '';
    let i = 0;
    let openSection = false;
    while (i < lines.length){
      const line = lines[i];

      if (/^##\s+/.test(line)){
        if (openSection) html += '</div>';
        const heading = line.replace(/^##\s+/, '').trim();
        html += sectionOpenTag(heading);
        html += '<h2>' + escapeHtml(heading) + '</h2>';
        openSection = true;
        i++; continue;
      }
      if (line.trim() === ''){ i++; continue; }

      if (/^```/.test(line)){
        const lang = line.replace(/^```/, '').trim();
        const codeLines = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])){ codeLines.push(lines[i]); i++; }
        i++; // skip closing fence
        html += '<pre class="codeblock lang-' + (lang || 'text') + '"><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)){
        html += '<ol>';
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])){
          html += '<li>' + inline(lines[i].replace(/^\d+\.\s+/, '')) + '</li>';
          i++;
        }
        html += '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)){
        html += '<ul>';
        while (i < lines.length && /^-\s+/.test(lines[i])){
          html += '<li>' + inline(lines[i].replace(/^-\s+/, '')) + '</li>';
          i++;
        }
        html += '</ul>';
        continue;
      }

      // paragraph — gather until blank line / special line
      const para = [];
      while (i < lines.length && lines[i].trim() !== '' &&
             !/^##\s+/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^\d+\.\s+/.test(lines[i]) && !/^-\s+/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      html += '<p>' + inline(para.join(' ')) + '</p>';
    }
    if (openSection) html += '</div>';
    return html;
  }

  const SECTION_META = {
    'Core Concepts': { tag: 'section', cls: 'section core', collapsible: false },
    'Deeper Dive':   { tag: 'details', cls: 'reveal deep', collapsible: true },
    'Common Mistakes': { tag: 'details', cls: 'reveal mistakes', collapsible: true },
    'Interview Questions': { tag: 'details', cls: 'reveal qa', collapsible: true },
    'Quick Test': { tag: 'details', cls: 'reveal quiz', collapsible: true }
  };
  function sectionOpenTag(heading){
    const meta = SECTION_META[heading] || { tag: 'section', cls: 'section', collapsible: false };
    if (meta.collapsible){
      return '<details class="' + meta.cls + '"><summary>' + escapeHtml(heading) + '</summary><div class="reveal-body">';
    }
    return '<div class="' + meta.cls + '">';
  }
  // patch renderMarkdown's closing tag logic to match open tag type
  function renderTopic(md){
    const lines = md.split('\n');
    let html = '';
    let i = 0;
    let closer = '';
    while (i < lines.length){
      const line = lines[i];
      if (/^##\s+/.test(line)){
        if (closer) html += closer;
        const heading = line.replace(/^##\s+/, '').trim();
        const meta = SECTION_META[heading] || { tag: 'section', cls: 'section', collapsible: false };
        if (meta.collapsible){
          html += '<details class="' + meta.cls + '"><summary>' + escapeHtml(heading) + '</summary><div class="reveal-body">';
          closer = '</div></details>';
        } else {
          html += '<div class="' + meta.cls + '"><h2>' + escapeHtml(heading) + '</h2>';
          closer = '</div>';
        }
        if (meta.collapsible) { /* no visible h2 inside collapsible, summary already shows the label */ }
        i++; continue;
      }
      if (line.trim() === ''){ i++; continue; }
      if (/^```/.test(line)){
        const lang = line.replace(/^```/, '').trim();
        const codeLines = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])){ codeLines.push(lines[i]); i++; }
        i++;
        html += '<pre class="codeblock lang-' + (lang || 'text') + '"><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
        continue;
      }
      if (/^\d+\.\s+/.test(line)){
        html += '<ol>';
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])){
          html += '<li>' + inline(lines[i].replace(/^\d+\.\s+/, '')) + '</li>';
          i++;
        }
        html += '</ol>';
        continue;
      }
      if (/^-\s+/.test(line)){
        html += '<ul>';
        while (i < lines.length && /^-\s+/.test(lines[i])){
          html += '<li>' + inline(lines[i].replace(/^-\s+/, '')) + '</li>';
          i++;
        }
        html += '</ul>';
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() !== '' &&
             !/^##\s+/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^\d+\.\s+/.test(lines[i]) && !/^-\s+/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      html += '<p>' + inline(para.join(' ')) + '</p>';
    }
    if (closer) html += closer;
    return html;
  }

  /* ---------- progress (localStorage) ---------- */
  let done = [];
  try { done = JSON.parse(localStorage.getItem('ip_done') || '[]'); } catch(e){ done = []; }
  function saveDone(){ try { localStorage.setItem('ip_done', JSON.stringify(done)); } catch(e){} }
  function isDone(id){ return done.indexOf(id) !== -1; }
  function toggleDone(id){
    const idx = done.indexOf(id);
    if (idx === -1) done.push(id); else done.splice(idx,1);
    saveDone(); updateProgress(); renderNav(currentFilter);
  }
  function updateProgress(){
    const pct = Math.round((done.length / TOPICS.length) * 100);
    document.getElementById('progress-text').textContent = done.length + ' / ' + TOPICS.length + ' done';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  /* ---------- theme ---------- */
  const themeBtn = document.getElementById('theme-toggle');
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('ip_theme'); } catch(e){}
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', function(){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ip_theme', next); } catch(e){}
  });

  /* ---------- sidebar nav ---------- */
  const navGroups = document.getElementById('nav-groups');
  let currentId = null;
  let currentFilter = '';

  function matches(topic, q){
    if (!q) return true;
    q = q.toLowerCase();
    return topic.title.toLowerCase().indexOf(q) !== -1 || topic.raw.toLowerCase().indexOf(q) !== -1;
  }

  function renderNav(filter){
    currentFilter = filter || '';
    navGroups.innerHTML = '';
    GROUP_ORDER.forEach(function(group){
      const topicsInGroup = TOPICS.filter(t => t.group === group);
      const visible = topicsInGroup.filter(t => matches(t, currentFilter));
      if (currentFilter && visible.length === 0) return;
      const groupEl = document.createElement('div');
      groupEl.className = 'group';
      const titleEl = document.createElement('p');
      titleEl.className = 'group-title';
      titleEl.textContent = group;
      groupEl.appendChild(titleEl);
      const list = document.createElement('ul');
      list.className = 'topic-list';
      topicsInGroup.forEach(function(t){
        const li = document.createElement('li');
        li.className = 'topic-item';
        if (currentFilter && !matches(t, currentFilter)) li.classList.add('hidden');
        if (t.id === currentId) li.classList.add('active');
        if (isDone(t.id)) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isDone(t.id);
        cb.setAttribute('aria-label', 'Mark ' + t.title + ' as done');
        cb.addEventListener('change', function(e){ e.stopPropagation(); toggleDone(t.id); });

        const link = document.createElement('button');
        link.className = 'topic-link';
        link.textContent = t.title;
        link.addEventListener('click', function(){ showTopic(t.id); closeSidebarMobile(); });

        li.appendChild(cb);
        li.appendChild(link);
        list.appendChild(li);
      });
      groupEl.appendChild(list);
      navGroups.appendChild(groupEl);
    });
  }

  /* ---------- main content ---------- */
  const contentEl = document.getElementById('content');
  const titleEl = document.getElementById('topic-title');
  const crumbEl = document.getElementById('crumb');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const prevLabel = document.getElementById('prev-label');
  const nextLabel = document.getElementById('next-label');

  function highlight(html, q){
    if (!q) return html;
    try {
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      // avoid matching inside tags by splitting on tags
      return html.split(/(<[^>]+>)/g).map(function(chunk){
        if (chunk.startsWith('<')) return chunk;
        return chunk.replace(re, '<mark class="hit">$1</mark>');
      }).join('');
    } catch(e){ return html; }
  }

  function showTopic(id){
    const idx = TOPICS.findIndex(t => t.id === id);
    if (idx === -1) return;
    const topic = TOPICS[idx];
    currentId = id;
    location.hash = id;
    crumbEl.textContent = topic.group;
    titleEl.textContent = topic.title;
    let html = renderTopic(topic.raw);
    html = highlight(html, currentFilter);
    contentEl.innerHTML = html;

    const prev = TOPICS[idx - 1];
    const next = TOPICS[idx + 1];
    btnPrev.disabled = !prev;
    btnNext.disabled = !next;
    prevLabel.textContent = prev ? prev.title : '';
    nextLabel.textContent = next ? next.title : '';
    btnPrev.onclick = prev ? function(){ showTopic(prev.id); } : null;
    btnNext.onclick = next ? function(){ showTopic(next.id); } : null;

    renderNav(currentFilter);
    document.getElementById('main-inner').scrollTop = 0;
    window.scrollTo(0,0);
  }

  /* ---------- search ---------- */
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function(){
    renderNav(searchInput.value.trim());
    if (currentId) showTopic(currentId);
  });

  /* ---------- mobile sidebar ---------- */
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('sidebar-toggle').addEventListener('click', function(){
    sidebar.classList.add('open'); scrim.classList.add('show');
  });
  scrim.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }

  /* ---------- init ---------- */
  updateProgress();
  renderNav('');
  const hashId = location.hash.replace('#','');
  const startId = TOPICS.find(t => t.id === hashId) ? hashId : TOPICS[0].id;
  showTopic(startId);
})();
</script>
